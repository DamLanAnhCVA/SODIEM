let _taskPopEl=null, _taskPopOutsideHandler=null;
// Popover tích chọn nhanh thành viên, neo cạnh nút bấm trong ô bảng — không cần mở modal.
// Nếu đã có thành viên được chọn từ trước, mặc định chỉ hiện danh sách các thành viên đó
// (xem đầy đủ, không bị rút gọn "+N") kèm nút "✏️ Sửa danh sách" — bấm vào mới hiện lại
// toàn bộ học sinh trong lớp để tick chọn/bỏ chọn. Nếu chưa có ai được chọn thì hiện luôn
// danh sách cả lớp để chọn.
// onSave(ids, roles) được gọi khi đóng popover (bấm "Xong", click ra ngoài).
function openTaskMemberPopover(anchorEl, initialIds, initialRoles, onSave){
  closeTaskMemberPopover();
  const ids = initialIds||[];
  const roles = initialRoles||{};
  const pop = el('div',{class:'score-popover', style:'width:280px'});
  let saved = false;
  let getCurrentState = ()=> ({ids, roles});
  const commit = ()=>{ if(saved) return; saved = true; const st = getCurrentState(); onSave(st.ids, st.roles); };

  function reposition(){
    const r = anchorEl.getBoundingClientRect();
    const popW = 280;
    let left = Math.min(Math.max(8, r.left), window.innerWidth - popW - 8);
    pop.style.left = left+'px';
    pop.style.top = (r.bottom + 6)+'px';
    requestAnimationFrame(()=>{
      const ph = pop.getBoundingClientRect().height;
      if(r.bottom + 6 + ph > window.innerHeight - 8) pop.style.top = Math.max(8, r.top - ph - 6)+'px';
    });
  }

  function renderEditMode(){
    pop.innerHTML = '';
    const picker = buildMemberPicker(ids, roles);
    getCurrentState = ()=> ({ids: picker.getSelected(), roles: picker.getRoles()});
    pop.appendChild(el('div',{style:'font-weight:700; font-size:12.5px; margin-bottom:6px'}, '👥 Thành viên tham gia'));
    pop.appendChild(picker.wrap);
    const doneBtn = el('button',{class:'btn btn-primary btn-sm', style:'width:100%; margin-top:8px'}, 'Xong');
    doneBtn.addEventListener('click', ()=>{ commit(); closeTaskMemberPopover(); });
    pop.appendChild(doneBtn);
    reposition();
  }

  function renderViewMode(){
    pop.innerHTML = '';
    getCurrentState = ()=> ({ids, roles});
    pop.appendChild(el('div',{style:'font-weight:700; font-size:12.5px; margin-bottom:6px'}, `👥 Thành viên tham gia (${ids.length})`));
    const listBox = el('div',{style:'max-height:220px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; padding:8px; margin-bottom:8px'});
    ids.forEach(id=>{
      const s = State.students.find(x=>x.id===id);
      if(!s) return;
      const r = roles[id];
      listBox.appendChild(el('div',{style:'padding:4px 2px; font-size:13px'}, r ? `${s.name} (${r})` : s.name));
    });
    pop.appendChild(listBox);
    const editBtn = el('button',{class:'btn btn-ghost btn-sm', style:'width:100%'}, '✏️ Sửa danh sách');
    editBtn.addEventListener('click', renderEditMode);
    pop.appendChild(editBtn);
    reposition();
  }

  document.body.appendChild(pop);
  if(ids.length){ renderViewMode(); } else { renderEditMode(); }
  _taskPopEl = pop;
  _taskPopOutsideHandler = (e)=>{ if(!pop.contains(e.target) && e.target!==anchorEl){ commit(); closeTaskMemberPopover(); } };
  document.addEventListener('mousedown', _taskPopOutsideHandler, true);
  document.addEventListener('keydown', _taskPopEscHandler, true);
}
// Một dòng nhiệm vụ đã có sẵn: GVCN sửa trực tiếp trên ô bảng (không cần modal),
// các vai trò khác chỉ xem (giữ nguyên hiển thị dạng text như trước).
function buildTaskRow(item, idx, isGvcn, tint, color){
  const numBadge = el('span',{style:`display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:50%; background:${tint}; color:${color}; font-weight:800; font-size:12px; flex-shrink:0`}, String(idx+1));
  const tr = el('tr',{style:`background:${tint}`, 'data-task-id': item.id}, el('td',{style:'text-align:center'}, numBadge));

  if(!isGvcn){
    const members = (item.memberIds||[]).map(id=> State.students.find(s=>s.id===id)).filter(Boolean);
    const roles = item.memberRoles||{};
    const memberLabel = members.length ? members.map(m=> roles[m.id] ? `${m.name} (${roles[m.id]})` : m.name).join(', ') : '—';
    const st = TASK_STATUS[taskStatusOf(item)] || TASK_STATUS.todo;
    tr.appendChild(el('td',{}, fmtDate(new Date(item.date).getTime())));
    tr.appendChild(el('td',{}, item.deadline ? fmtDate(new Date(item.deadline).getTime()) : '—'));
    tr.appendChild(el('td',{}, el('strong',{style:`color:${color}`}, item.event||'—')));
    tr.appendChild(el('td',{}, item.task||'—'));
    tr.appendChild(el('td',{style:'max-width:220px; white-space:normal'}, memberLabel));
    tr.appendChild(el('td',{style:'text-align:center'}, el('span',{class:'badge '+st.cls}, st.label)));
    const resultCell = el('td',{style:'max-width:200px; white-space:normal'}, item.result||'—');
    const evidence = item.evidence||[];
    if(evidence.length){
      const evWrap = el('div',{style:'margin-top:4px; display:flex; flex-direction:column; gap:2px'});
      evidence.forEach(f=> evWrap.appendChild(el('a',{href:f.url, target:'_blank', rel:'noopener', style:'font-size:11.5px'}, (f.type&&f.type.startsWith('image')?'🖼️ ':'📄 ')+f.name)));
      resultCell.appendChild(evWrap);
    }
    tr.appendChild(resultCell);
    return tr;
  }

  const patch = (fields)=> db.collection('classes').doc(State.classId).collection('tasks').doc(item.id).update({...fields, updatedAt:Date.now()})
    .catch(e=> toast('Lỗi lưu: '+e.message, 'rose'));

  const dateIn = el('input',{class:'input', type:'date', style:'min-width:132px', value: new Date(item.date).toISOString().slice(0,10)});
  dateIn.addEventListener('change', ()=>{ if(dateIn.value) patch({date: new Date(dateIn.value).getTime()}); });
  tr.appendChild(el('td',{}, dateIn));

  const deadlineIn = el('input',{class:'input', type:'date', style:'min-width:132px', value: item.deadline||''});
  deadlineIn.addEventListener('change', ()=> patch({deadline: deadlineIn.value || null}));
  tr.appendChild(el('td',{}, deadlineIn));

  const eventIn = el('input',{class:'input task-cell-event', style:'min-width:150px', placeholder:'VD: Hội trại 26/3…', value: item.event||''});
  eventIn.addEventListener('change', ()=> patch({event: eventIn.value.trim()}));
  tr.appendChild(el('td',{}, eventIn));

  const taskIn = el('input',{class:'input', style:'min-width:170px', placeholder:'Nội dung nhiệm vụ', value: item.task||''});
  taskIn.addEventListener('change', ()=> patch({task: taskIn.value.trim()}));
  tr.appendChild(el('td',{}, taskIn));

  const memberBtn = el('button',{class:'btn btn-ghost btn-sm', style:'width:100%; min-width:140px; justify-content:flex-start; overflow:hidden; text-overflow:ellipsis; white-space:nowrap'}, memberShortLabel(item.memberIds));
  memberBtn.addEventListener('click', ()=> openTaskMemberPopover(memberBtn, item.memberIds||[], item.memberRoles||{}, (ids, roles)=> patch({memberIds: ids, memberRoles: roles})));
  tr.appendChild(el('td',{}, memberBtn));

  const statusSel = el('select',{class:'input', style:'min-width:112px'});
  Object.entries(TASK_STATUS).forEach(([k,v])=> statusSel.appendChild(el('option',{value:k}, v.label)));
  statusSel.value = item.status || 'todo';
  statusSel.addEventListener('change', ()=> patch({status: statusSel.value}));
  tr.appendChild(el('td',{}, statusSel));

  const resultIn = el('input',{class:'input', style:'min-width:150px', placeholder:'Kết quả (tuỳ chọn)', value: item.result||''});
  resultIn.addEventListener('change', ()=> patch({result: resultIn.value.trim()}));
  tr.appendChild(el('td',{}, resultIn));

  // Không còn icon riêng trên từng dòng nữa — thao tác In/Sửa/Xoá gộp chung
  // vào ô chọn nhiệm vụ ở đầu trang (xem viewPhanCong). Ô trống này chỉ để
  // giữ đúng số cột với dòng "+ Thêm" bên dưới.
  tr.appendChild(el('td',{}));
  return tr;
}
// Cuộn tới và làm nổi bật một dòng nhiệm vụ trong bảng, đồng thời focus vào ô
// "Sự kiện" để GVCN gõ sửa ngay — dùng cho nút "✏️ Sửa" cạnh ô chọn nhiệm vụ.
function focusTaskRow(taskId){
  const tr = document.querySelector('tr[data-task-id="'+CSS.escape(taskId)+'"]');
  if(!tr) return;
  tr.scrollIntoView({behavior:'smooth', block:'center'});
  const prevBg = tr.style.background;
  tr.style.transition = 'background .25s';
  tr.style.background = 'var(--amber-tint)';
  setTimeout(()=>{ tr.style.background = prevBg; }, 1100);
  const inp = tr.querySelector('.task-cell-event');
  if(inp) inp.focus();
}
let _pendingTaskDeleteId = null;
// Xoá có Hoàn tác: khoá tạm dòng trên giao diện + hiện toast 6 giây, chỉ thực sự
// xoá trên Firestore nếu hết giờ mà không bấm Hoàn tác.
function requestDeleteTask(item){
  if(_pendingTaskDeleteId === item.id) return;
  const tr = document.querySelector('tr[data-task-id="'+CSS.escape(item.id)+'"]');
  if(tr){ tr.style.opacity='0.35'; tr.style.pointerEvents='none'; }
  _pendingTaskDeleteId = item.id;
  toastUndo('Đã xoá nhiệm vụ "'+(item.event||item.task||'')+'"',
    ()=>{
      if(_pendingTaskDeleteId===item.id){
        db.collection('classes').doc(State.classId).collection('tasks').doc(item.id).delete()
          .catch(e=> toast('Lỗi xoá: '+e.message, 'rose'));
        _pendingTaskDeleteId = null;
      }
    },
    ()=>{
      _pendingTaskDeleteId = null;
      if(tr){ tr.style.opacity=''; tr.style.pointerEvents=''; }
    }
  );
}

// ô Sự kiện/Nhiệm vụ) để lưu; bảng tự làm mới dòng nhập sau khi lưu thành công.
function buildTaskAddRow(){
  let draftIds = [], draftRoles = {};
  const tr = el('tr',{style:'background:var(--paper-2)'},
    el('td',{style:'text-align:center'}, el('span',{class:'muted', style:'font-weight:800; font-size:15px'}, '+')));

  const dateIn = el('input',{class:'input', type:'date', style:'min-width:132px', value: todayStr()});
  tr.appendChild(el('td',{}, dateIn));

  const deadlineIn = el('input',{class:'input', type:'date', style:'min-width:132px'});
  tr.appendChild(el('td',{}, deadlineIn));

  const eventIn = el('input',{class:'input', style:'min-width:150px', placeholder:'VD: Hội trại 26/3…'});
  tr.appendChild(el('td',{}, eventIn));

  const taskIn = el('input',{class:'input', style:'min-width:170px', placeholder:'Nội dung nhiệm vụ'});
  tr.appendChild(el('td',{}, taskIn));

  const memberBtn = el('button',{class:'btn btn-ghost btn-sm', style:'width:100%; min-width:140px; justify-content:flex-start; overflow:hidden; text-overflow:ellipsis; white-space:nowrap'}, memberShortLabel(draftIds));
  memberBtn.addEventListener('click', ()=> openTaskMemberPopover(memberBtn, draftIds, draftRoles, (ids, roles)=>{
    draftIds = ids; draftRoles = roles;
    memberBtn.textContent = memberShortLabel(draftIds);
  }));
  tr.appendChild(el('td',{}, memberBtn));

  const statusSel = el('select',{class:'input', style:'min-width:112px'});
  Object.entries(TASK_STATUS).forEach(([k,v])=> statusSel.appendChild(el('option',{value:k}, v.label)));
  tr.appendChild(el('td',{}, statusSel));

  const resultIn = el('input',{class:'input', style:'min-width:150px', placeholder:'Kết quả (tuỳ chọn)'});
  tr.appendChild(el('td',{}, resultIn));

  const saveRow = async ()=>{
    if(!eventIn.value.trim() && !taskIn.value.trim()){ toast('Nhập ít nhất Sự kiện hoặc Nhiệm vụ', 'rose'); return; }
    saveBtn.disabled = true;
    try{
      await db.collection('classes').doc(State.classId).collection('tasks').add({
        date: dateIn.value ? new Date(dateIn.value).getTime() : Date.now(),
        deadline: deadlineIn.value || null,
        event: eventIn.value.trim(),
        task: taskIn.value.trim(),
        memberIds: draftIds,
        memberRoles: draftRoles,
        status: statusSel.value || 'todo',
        result: resultIn.value.trim(),
        createdAt: Date.now(), updatedAt: Date.now(), createdByUid: State.user.uid,
      });
      toast('Đã thêm nhiệm vụ', 'sage');
      // Bảng sẽ tự vẽ lại dòng nhập trống mới khi Firestore đồng bộ về (onSnapshot → renderAll()).
    }catch(e){ toast('Lỗi thêm nhiệm vụ: '+e.message, 'rose'); saveBtn.disabled = false; }
  };
  [eventIn, taskIn].forEach(inp=> inp.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); saveRow(); } }));
  const saveBtn = el('button',{class:'btn btn-primary btn-sm', onclick: saveRow}, '+ Thêm');
  tr.appendChild(el('td',{style:'text-align:right; white-space:nowrap'}, saveBtn));
  return tr;
}
function viewPhanCong(main, {isGvcn}){

    let label = (item.event || item.task || 'Nhiệm vụ') + ' — ' + fmtDate(new Date(item.date).getTime());

    actions.push(exportSel);

      if(item) exportTaskRow(item); else toast('Chọn nhiệm vụ cần xuất', 'rose');
    }}, '⬇️ Xuất Excel'));

      actions.push(el('button',{class:'btn btn-ghost btn-sm', title:'Cuộn tới dòng để sửa', onclick:()=>{

    el('th',{style:'text-align:center'},'Trạng thái'), el('th',{},'Kết quả'), isGvcn?el('th',{},''):null)));

function taskReportRows(item){

    ['Trạng thái', st.label],
    ['Thành viên tham gia', members.map(m=> roles[m.id] ? `${m.name} (${roles[m.id]})` : m.name).join(', ') || ''],
    ['Kết quả thực hiện', item.result||''],
    ['Minh chứng', evidence.map(f=>f.name).join(', ')],
  ];

// Màu chữ nổi bật cho vai trò trưởng/phó khi in PDF gửi nhóm.
function roleColorStyle(role){
  const r = (role||'').toLowerCase();
  if(r.includes('trưởng')) return 'color:#1B7A6E; font-weight:700;'; // teal đậm
  if(r.includes('phó'))    return 'color:#B5762B; font-weight:700;'; // amber đậm
  if(role) return 'color:#4A5568; font-weight:600;';
  return '';
}
function exportTaskPdf(item){
  const members = (item.memberIds||[]).map(id=> State.students.find(s=>s.id===id)).filter(Boolean);
  const roles = item.memberRoles||{};
  const st = TASK_STATUS[taskStatusOf(item)] || TASK_STATUS.todo;
  const rowsHtml = members.length ? members.map((m,i)=>{
    const role = roles[m.id]||'';
    return `<tr><td>${i+1}</td><td style="text-align:left">${escapeHtml(m.name)}</td><td style="text-align:left; ${roleColorStyle(role)}">${escapeHtml(role||'Thành viên')}</td></tr>`;
  }).join('') : `<tr><td colspan="3">Chưa có thành viên nào được phân công</td></tr>`;
  const title = item.event || item.task || 'Nhiệm vụ';
  const evidence = item.evidence||[];
  const evidenceHtml = evidence.length ? `<p style="margin-top:10px"><strong>Minh chứng:</strong></p><ul>${evidence.map(f=>`<li><a href="${f.url}">${escapeHtml(f.name)}</a></li>`).join('')}</ul>` : '';
  openPrintWindow(title, `
    <h2>${escapeHtml(title)}</h2>
    <p>Lớp: ${escapeHtml(State.klass.name)} — Ngày phân công: ${fmtDate(new Date(item.date).getTime())}${item.deadline ? ' — Hạn hoàn thành: '+fmtDate(new Date(item.deadline).getTime()) : ''} — Trạng thái: ${escapeHtml(st.label)}</p>
    ${item.task ? `<p><strong>Nhiệm vụ:</strong> ${escapeHtml(item.task).replace(/\n/g,'<br>')}</p>` : ''}
    <table><thead><tr><th>#</th><th style="text-align:left">Họ tên</th><th style="text-align:left">Vai trò</th></tr></thead><tbody>${rowsHtml}</tbody></table>
    ${item.result ? `<p style="margin-top:16px"><strong>Kết quả thực hiện:</strong> ${escapeHtml(item.result).replace(/\n/g,'<br>')}</p>` : ''}
    ${evidenceHtml}
  `);
}
function exportTaskRow(item){
  const ws = XLSX.utils.aoa_to_sheet(taskReportRows(item));

function exportAllTasks(){
  if(!State.tasks.length){ toast('Chưa có nhiệm vụ nào để xuất', 'rose'); return; }
  const rows = [['Ngày PC','Sự kiện','Nhiệm vụ','Thành viên tham gia','Hạn hoàn thành','Trạng thái','Kết quả','Minh chứng']];
  State.tasks.slice().sort((a,b)=> a.date-b.date).forEach(item=>{
    const members = (item.memberIds||[]).map(id=> State.students.find(s=>s.id===id)).filter(Boolean);

const FIRESTORE_RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() { return request.auth != null; }

    // Dùng cho CHÍNH document /classes/{classId}: đọc thẳng resource.data,
    // KHÔNG get() lại chính nó — tự-tham-chiếu bằng get() trong lúc đang
    // liệt kê (list/query) collection "classes" là nguyên nhân gây lỗi
    // permission-denied dù đúng là chủ nhiệm/GVBM của lớp.
    function isGvcnSelf() { return signedIn() && resource.data.gvcnUid == request.auth.uid; }
    function isGvbmSelf() { return signedIn() && request.auth.uid in resource.data.gvbmUids; }
    // Lớp do một GVBM tự tạo để theo dõi riêng, CHƯA có ai nhận làm GVCN
    // (gvcnUid == null): cho phép đúng người đã tạo ra lớp đó (createdByUid)
    // xoá lớp, kể cả khi họ không phải GVCN.
    function isCreatorOfOrphanClass() { return signedIn() && resource.data.gvcnUid == null && resource.data.createdByUid == request.auth.uid; }

    // Dùng cho các subcollection (students, attendance, subjects, ...):
    // ở đây resource là tài liệu con nên PHẢI get() lên tài liệu lớp cha.
    function classDoc(classId) { return get(/databases/$(database)/documents/classes/$(classId)).data; }
    function isGvcn(classId) { return signedIn() && classDoc(classId).gvcnUid == request.auth.uid; }
    function isGvbm(classId) { return signedIn() && request.auth.uid in classDoc(classId).gvbmUids; }
    function inClass(classId) { return isGvcn(classId) || isGvbm(classId); }
    // Người tạo ra một lớp "mồ côi" (GVBM tự tạo, chưa có ai làm GVCN):
    // cho phép chính họ tự quản lý danh sách học sinh của lớp đó, vì
    // không có GVCN nào khác sẽ làm việc đó thay họ.
    function isOrphanOwner(classId) { return signedIn() && classDoc(classId).gvcnUid == null && classDoc(classId).createdByUid == request.auth.uid; }

    // GVBM tự thêm mình vào lớp qua mã mời: CHỈ được nối thêm đúng uid
    // của chính mình vào gvbmUids, không được đổi/xoá bất kỳ trường nào khác
    // (kể cả gvcnUid) — chặn việc một GVBM tự "chiếm" hoặc sửa lớp.
    function isJoiningAsGvbm() {
      let before = resource.data;
      let after  = request.resource.data;
      return signedIn()
        && after.diff(before).affectedKeys().hasOnly(['gvbmUids'])
        && after.gvbmUids.size() == before.gvbmUids.size() + 1
        && after.gvbmUids.hasAll(before.gvbmUids)
        && (request.auth.uid in after.gvbmUids);
    }

    // Môn học (subjects): mỗi GVBM chỉ được tạo/sửa/xoá đúng môn của mình
    // (teacherUid == uid đang đăng nhập). GVCN có toàn quyền quản trị.
    function ownsSubject(classId) {
      return signedIn() && (
        isGvcn(classId) ||
        (request.resource != null && request.resource.data.teacherUid == request.auth.uid) ||
        (resource != null && resource.data.teacherUid == request.auth.uid)
      );
    }

    // Điểm số (gradebook): chỉ GVBM đứng tên môn đó mới được ghi điểm của môn đó.
    function ownsGradebookEntry(classId) {
      let subjId = request.resource != null ? request.resource.data.subjectId : resource.data.subjectId;
      return signedIn() && (
        isGvcn(classId) ||
        get(/databases/$(database)/documents/classes/$(classId)/subjects/$(subjId)).data.teacherUid == request.auth.uid
      );
    }

    match /teachers/{uid} {
      allow read, write: if signedIn() && request.auth.uid == uid;
    }

    match /classes/{classId} {
      allow read:   if isGvcnSelf() || isGvbmSelf();
      allow create: if signedIn();
      // Chỉ GVCN được sửa thông tin lớp, TRỪ trường hợp một GVBM đang
      // tự thêm mình vào lớp bằng mã mời (isJoiningAsGvbm).
      allow update: if isGvcnSelf() || isJoiningAsGvbm();
      allow delete: if isGvcnSelf() || isCreatorOfOrphanClass();

      // Học sinh: GVCN được thêm/sửa/xoá. GVBM chỉ đọc, TRỪ trường hợp
      // chính họ là người tạo ra lớp "mồ côi" này (chưa có ai làm GVCN)
      // thì được tự quản lý danh sách học sinh của lớp mình.
      match /students/{studentId} {
        allow read:  if inClass(classId);
        allow write: if isGvcn(classId) || isOrphanOwner(classId);
      }

      // Điểm danh: CHỈ GVCN được ghi/sửa. GVBM chỉ đọc.
      match /attendance/{dateId} {
        allow read:  if inClass(classId);
        allow write: if isGvcn(classId);
      }

      // Vi phạm / tuyên dương (hạnh kiểm): CHỈ GVCN được ghi/xoá. GVBM chỉ đọc.
      match /conduct/{itemId} {
        allow read:  if inClass(classId);
        allow write: if isGvcn(classId);
      }

      // Môn học: GVBM ghi được đúng môn mình phụ trách, GVCN toàn quyền.
      match /subjects/{subjectId} {
        allow read:  if inClass(classId);
        allow write: if ownsSubject(classId);
      }

      // Điểm số từng môn: GVBM ghi được đúng môn mình phụ trách, GVCN toàn quyền.
      match /gradebook/{entryId} {
        allow read:  if inClass(classId);
        allow write: if ownsGradebookEntry(classId);
      }

      // Bảng điểm tổng hợp cuối kì/năm + hạnh kiểm/học lực (dùng ghi học bạ):
      // CHỈ GVCN được ghi/sửa. GVBM chỉ đọc.
      match /finalScores/{studentId} {
        allow read:  if inClass(classId);
        allow write: if isGvcn(classId);
      }

      // Sổ đầu bài (nội dung tiết học đã dạy, đồng bộ từ kế hoạch dạy học):
      // GVCN và GVBM của lớp đều đọc/ghi được, để GVBM tự ghi tiết mình dạy.
      match /logbook/{entryId} {
        allow read, write: if inClass(classId);
      }

      // Phân công nhiệm vụ (bảng công việc riêng của GVCN): CHỈ GVCN được
      // ghi/sửa/xoá. GVBM trong lớp chỉ đọc (để biết mình được phân việc gì).
      match /tasks/{taskId} {
        allow read:  if inClass(classId);
        allow write: if isGvcn(classId);
      }
    }
  }
}`;

// Rules cho Firebase Storage (file minh chứng nhiệm vụ). Dán vào Firebase Console →
// Storage → Rules. Chỉ GVCN của lớp mới được tải lên/xoá; ai đã đăng nhập và ở
// trong lớp đó thì đọc được (để xem minh chứng qua link).
const STORAGE_RULES = `rules_version = '2';
service firebase.storage {
  match /b/{bucket}/o {
    match /taskEvidence/{classId}/{allPaths=**} {
      allow read: if request.auth != null;
      allow write: if request.auth != null
        && firestore.get(/databases/(default)/documents/classes/$(classId)).data.gvcnUid == request.auth.uid;
    }
  }
}`;

async function deleteAllDocsIn(collRef){
  const snap = await collRef.get();
  let batch = db.batch(); let n=0;
  for(const d of snap.docs){
    batch.delete(d.ref); n++;
    if(n%400===0){ await batch.commit(); batch = db.batch(); }
  }
  if(n%400!==0) await batch.commit();
}
async function deleteCurrentClass(){
  if(!State.klass) return;
  const name = State.klass.name;
  if(!confirm(`Xoá vĩnh viễn lớp "${name}" cùng toàn bộ dữ liệu bên trong (học sinh, điểm số, điểm danh, hạnh kiểm…)? Không thể hoàn tác.`)) return;
  if(!confirm('Xác nhận lần cuối: bạn CHẮC CHẮN muốn xoá lớp "'+name+'"?')) return;
  const classRef = db.collection('classes').doc(State.classId);
  try{
    toast('Đang xoá lớp…');
    for(const sub of ['students','attendance','conduct','subjects','gradebook','finalScores']){
      await deleteAllDocsIn(classRef.collection(sub));
    }
    await classRef.delete();
    toast('Đã xoá lớp '+name, 'sage');
    closeModal();
    State.classId = null; State.klass = null;
    detachListeners();
    loadMyClasses();
  }catch(e){
    toast('Lỗi xoá lớp: '+e.message, 'rose');
  }
}
function exportAllDataJson(){
  const payload = { klass: State.klass, students: State.students, subjects: State.subjects, gradebook: State.gradebook, attendance: State.attendance, conduct: State.conduct, finalScores: State.finalScores, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `SaoLuu_${State.klass.name}.json`; a.click();
  toast('Đã tải file sao lưu','sage');
}
// Khôi phục dữ liệu lớp từ file JSON đã xuất bởi exportAllDataJson(). GHI ĐÈ (xoá hết rồi ghi lại)
// các subcollection students/subjects/gradebook/attendance/conduct/finalScores của lớp ĐANG CHỌN.
// Không đụng tới doc lớp (klass) — giữ nguyên gvcnUid/gvbmUids/tên lớp hiện tại để tránh xung đột quyền.
async function importAllDataJson(file){
  if(!State.classId){ toast('Chưa chọn lớp','rose'); return; }
  let data;
  try{
    const text = await file.text();
    data = JSON.parse(text);
  }catch(e){ toast('File JSON không hợp lệ: '+e.message, 'rose'); return; }

  const counts = {
    students: (data.students||[]).length,
    subjects: (data.subjects||[]).length,
    gradebook: Object.keys(data.gradebook||{}).length,
    attendance: Object.keys(data.attendance||{}).length,
    conduct: (data.conduct||[]).length,
    finalScores: Object.keys(data.finalScores||{}).length,
  };
  const summary = `Học sinh: ${counts.students}, Môn học: ${counts.subjects}, Điểm số: ${counts.gradebook}, Điểm danh: ${counts.attendance}, Vi phạm/tuyên dương: ${counts.conduct}, Bảng điểm tổng hợp: ${counts.finalScores}`;
  if(!confirm(`Khôi phục sẽ XOÁ TOÀN BỘ dữ liệu hiện tại của lớp "${State.klass?.name||''}" và thay bằng dữ liệu trong file sao lưu:\n${summary}\n\nBạn chắc chắn muốn tiếp tục?`)) return;
  if(!confirm('Xác nhận lần cuối: KHÔNG THỂ HOÀN TÁC. Tiếp tục khôi phục?')) return;

  toast('Đang khôi phục dữ liệu…');
  try{
    const classRef = db.collection('classes').doc(State.classId);
    for(const sub of ['students','subjects','gradebook','attendance','conduct','finalScores']){
      await deleteAllDocsIn(classRef.collection(sub));
    }
    let batch = db.batch(); let n=0;
    const addToBatch = (ref, docData)=>{
      batch.set(ref, docData);
      n++;
      return (n%400===0) ? (async()=>{ await batch.commit(); batch = db.batch(); })() : null;
    };
    for(const s of (data.students||[])){ const {id, ...rest} = s; await addToBatch(classRef.collection('students').doc(id), rest); }
    for(const s of (data.subjects||[])){ const {id, ...rest} = s; await addToBatch(classRef.collection('subjects').doc(id), rest); }
    for(const [key, val] of Object.entries(data.gradebook||{})){ const {id, ...rest} = val; await addToBatch(classRef.collection('gradebook').doc(key), rest); }
    for(const [date, val] of Object.entries(data.attendance||{})){ await addToBatch(classRef.collection('attendance').doc(date), val); }
    for(const c of (data.conduct||[])){ const {id, ...rest} = c; await addToBatch(classRef.collection('conduct').doc(id), rest); }
    for(const [sid, val] of Object.entries(data.finalScores||{})){ await addToBatch(classRef.collection('finalScores').doc(sid), val); }
    if(n%400!==0) await batch.commit();
    toast('Đã khôi phục dữ liệu từ file sao lưu','sage');
    closeModal();
  }catch(e){
    toast('Lỗi khôi phục: '+e.message, 'rose');
  }
}

  card.appendChild(el('h2', {style:'text-align:center; margin-top:8px'}, 'Không tải được thư viện Firebase'));
  card.appendChild(el('p', {class:'muted', style:'font-size:13px; line-height:1.7; margin-top:10px'},
    'Ứng dụng cần tải 3 tệp thư viện từ Google (gstatic.com) để hoạt động — đã thử cả nguồn dự phòng (cdnjs.cloudflare.com) nhưng vẫn không tải được. Nguyên nhân thường gặp: mất mạng đúng lúc trang tải, hoặc mạng (Wi-Fi trường/công ty, phần mềm diệt virus, tường lửa) đang chặn cả hai tên miền trên.'));
  card.appendChild(el('p', {class:'muted', style:'font-size:13px; line-height:1.7; margin-top:10px'},
    'Hãy kiểm tra kết nối mạng, thử đổi sang mạng khác (VD: 4G) hoặc tắt tạm phần mềm chặn quảng cáo/diệt virus, rồi bấm nút bên dưới để tải lại.'));
  card.appendChild(el('button', {class:'btn btn-primary', style:'width:100%; margin-top:14px', onclick: ()=> location.reload()}, '↻ Tải lại trang'));
  wrap.appendChild(card);
}

(function boot(){
  const ready = window.__firebaseSdkReady || Promise.reject(new Error('Không tìm thấy bộ tải Firebase SDK'));
  ready.then(()=>{
    if(typeof firebase === 'undefined'){ renderSdkLoadError(); return; }
    const cfg = LocalCfg.firebase;
    if(cfg){ initFirebase(cfg); }
    else { renderAuthScreen(); }
  }).catch(err=>{
    console.error('Lỗi tải Firebase SDK:', err);
    renderSdkLoadError();
  });
})();
</script>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Sổ Điểm &amp; Sổ Chủ Nhiệm</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Firebase (compat, easiest for a single static file) -->
<!-- Tải có dự phòng: nếu gstatic.com bị mạng chặn/lỗi, tự động thử lại qua cdnjs.cloudflare.com -->
<script>
(function(){
  var CDNS = [
    'https://www.gstatic.com/firebasejs/10.12.2/',
    'https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/'
  ];
  var FILES = ['firebase-app-compat.js','firebase-auth-compat.js','firebase-firestore-compat.js','firebase-storage-compat.js'];

  function loadScript(src){
    return new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = src;
      s.onload = function(){ resolve(); };
      s.onerror = function(){ reject(new Error('Không tải được: '+src)); };
      document.head.appendChild(s);
    });
  }
  function loadFileWithFallback(file){
    var i = 0;
    function tryNext(){
      if(i >= CDNS.length) return Promise.reject(new Error('Không tải được thư viện (đã thử hết nguồn dự phòng): '+file));
      var url = CDNS[i] + file; i++;
      return loadScript(url).catch(tryNext);
    }
    return tryNext();
  }
  window.__firebaseSdkReady = FILES.reduce(function(p, file){
    return p.then(function(){ return loadFileWithFallback(file); });
  }, Promise.resolve());
})();
</script>

<!-- SheetJS for Excel export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- Mammoth: đọc nội dung văn bản từ file .docx (dùng để đọc Kế hoạch dạy học) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

<style>
/* ==========================================================================
   DESIGN TOKENS — "Sổ điểm" (school ledger) system
   ========================================================================== */
:root{
  --ink:        #1B2A4A;   /* primary text / headers */
  --ink-soft:   #4B5A78;   /* secondary text */
  --paper:      #FBF9F4;   /* app background, warm paper */
  --paper-2:    #F3EFE5;   /* recessed panels */
  --card:       #FFFFFF;
  --line:       #E4DFD3;   /* hairline borders */
  --line-soft:  #EDE9DD;

  --teal:       #2F6F6D;   /* GVBM (subject teacher) primary */
  --teal-dark:  #204B4A;
  --teal-tint:  #E4EFEE;

  --amber:      #C97A2E;   /* GVCN (homeroom) primary */
  --amber-dark: #9C5E20;
  --amber-tint: #FBEEDD;

  --rose:       #B5535A;   /* violations / alerts */
  --rose-tint:  #FBEAEB;

  --sage:       #5E8B63;   /* positive / commendation */
  --sage-tint:  #E9F2E9;

  --radius-s: 8px;
  --radius-m: 14px;
  --radius-l: 22px;

  --shadow-1: 0 1px 2px rgba(27,42,74,.06), 0 1px 1px rgba(27,42,74,.04);
  --shadow-2: 0 8px 24px rgba(27,42,74,.10), 0 2px 6px rgba(27,42,74,.06);

  --font-display: 'Lora', Georgia, serif;
  --font-body: 'Be Vietnam Pro', -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.display{ font-family:var(--font-display); font-weight:600; color:var(--ink); margin:0; }
.mono{ font-family:var(--font-mono); }
button{ font-family:inherit; }
::selection{ background:var(--amber-tint); }
a{ color:inherit; }

/* focus ring — accessible, visible */
:focus-visible{ outline:2.5px solid var(--amber); outline-offset:2px; border-radius:4px; }

/* scrollbars */
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }

/* ==========================================================================
   LAYOUT SHELL
   ========================================================================== */
#app{ display:none; min-height:100vh; }
#app.ready{ display:flex; flex-direction:column; }

.topbar{
  display:flex; align-items:center; gap:14px;
  padding:12px 20px; background:var(--card);
  border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:40;
}
.brand{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
.brand-mark{
  width:34px; height:34px; border-radius:9px;
  background:linear-gradient(155deg, var(--teal), var(--amber));
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-family:var(--font-display); font-weight:700; font-size:16px;
}
.brand-name{ font-family:var(--font-display); font-weight:700; font-size:16px; line-height:1.1; }
.brand-sub{ font-size:11px; color:var(--ink-soft); }

/* Dải thương hiệu — dòng credit tác giả, nổi bật bằng chữ gradient */
.credit-bar{
  display:flex; align-items:center; justify-content:center; gap:6px;
  padding:5px 14px; background:linear-gradient(90deg, var(--teal-tint), var(--amber-tint) 50%, var(--rose-tint));
  border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:39;
}
.credit-bar-text{
  font-family:var(--font-display); font-weight:700; font-size:12px; letter-spacing:.01em;
  text-align:center; line-height:1.3;
  background:linear-gradient(90deg, var(--teal-dark), var(--amber-dark), var(--rose));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
@media (max-width:600px){ .credit-bar-text{ font-size:10.5px; } }

.class-switcher{
  display:flex; align-items:center; gap:8px; margin-left:8px;
  padding:6px 10px 6px 12px; background:var(--paper-2); border-radius:999px;
  border:1px solid var(--line); cursor:pointer; max-width:220px;
}
.class-switcher select{
  border:none; background:transparent; font-weight:600; font-size:13px; color:var(--ink);
  max-width:170px; cursor:pointer;
}

.topbar-spacer{ flex:1; }
.topbar-actions{ display:flex; align-items:center; gap:8px; }

/* Ledger-tab role switch — the signature element */
.role-tabs{
  display:flex; position:relative; background:var(--paper-2);
  border-radius:999px; padding:4px; border:1px solid var(--line);
}
.role-tab{
  position:relative; z-index:1; border:none; background:transparent; cursor:pointer;
  padding:8px 16px; font-weight:700; font-size:13px; border-radius:999px;
  color:var(--ink-soft); transition:color .25s ease; display:flex; align-items:center; gap:6px;
  white-space:nowrap; flex:1; justify-content:center;
}
.role-tab.active{ color:#fff; }
.role-tabs .tab-pill{
  position:absolute; top:4px; bottom:4px; left:4px; width:calc(50% - 4px);
  border-radius:999px; z-index:0; background:var(--rose);
  transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.role-tabs[data-active="gvbm"] .tab-pill{ transform:translateX(0%); }
.role-tabs[data-active="gvcn"] .tab-pill{ transform:translateX(100%); }

.icon-btn{
  width:36px; height:36px; border-radius:10px; border:1px solid var(--line);
  background:var(--card); cursor:pointer; display:flex; align-items:center; justify-content:center;
  color:var(--ink-soft); transition:background .15s, color .15s;
}
.icon-btn:hover{ background:var(--paper-2); color:var(--ink); }

.shell{ display:flex; flex:1; min-height:0; }

.sidebar{
  width:220px; flex-shrink:0; background:var(--card); border-right:1px solid var(--line);
  padding:16px 12px; display:flex; flex-direction:column; gap:2px;
}
.sidebar-label{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); padding:10px 10px 6px; font-weight:700; }
.nav-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
  color:var(--ink-soft); font-weight:600; font-size:13.5px; cursor:pointer; border:none; background:transparent;
  text-align:left; width:100%; transition:background .15s, color .15s;
}
.nav-item:hover{ background:var(--paper-2); color:var(--ink); }
.nav-item.active{ background:var(--teal-tint); color:var(--teal-dark); }
[data-role="gvcn"] .nav-item.active{ background:var(--amber-tint); color:var(--amber-dark); }
.nav-item .dot{ width:6px; height:6px; border-radius:50%; background:var(--rose); margin-left:auto; }

.main{ flex:1; min-width:0; overflow-y:auto; padding:24px 28px 80px; }
.main-header{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
.main-title{ font-size:24px; }
.main-desc{ color:var(--ink-soft); font-size:13.5px; margin-top:4px; }

/* Bottom nav for mobile */
.bottom-nav{
  display:none; position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:var(--card); border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  justify-content:space-around; align-items:center;
}
.bnav-item{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  border:none; background:transparent; color:var(--ink-soft); font-size:10.5px; font-weight:600;
  padding:4px 6px; border-radius:10px; flex:1; min-width:0;
}
.bnav-item svg{ width:20px; height:20px; }
.bnav-item.active{ color:var(--teal); }
[data-role="gvcn"] .bnav-item.active{ color:var(--amber); }

/* ==========================================================================
   COMPONENTS
   ========================================================================== */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m);
  box-shadow:var(--shadow-1);
}
.card-pad{ padding:18px 20px; }
.section-title{ font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; }
.muted{ color:var(--ink-soft); }

.btn{
  display:inline-flex; align-items:center; gap:7px; justify-content:center;
  padding:9px 16px; border-radius:10px; border:1px solid transparent; cursor:pointer;
  font-weight:700; font-size:13px; transition:transform .1s ease, filter .15s, background .15s;
  white-space:nowrap;
}
.btn:active{ transform:scale(.97); }
.btn-primary{ background:var(--teal); color:#fff; }
[data-role="gvcn"] .btn-primary{ background:var(--amber); }
.btn-primary:hover{ filter:brightness(1.08); }
.btn-ghost{ background:transparent; border-color:var(--line); color:var(--ink); }
.btn-ghost:hover{ background:var(--paper-2); }
.btn-rose{ background:var(--rose-tint); color:var(--rose); }
.btn-sage{ background:var(--sage-tint); color:var(--sage); }
.btn-sm{ padding:6px 11px; font-size:12px; border-radius:8px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

.input, select.input, textarea.input{
  width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:10px;
  background:var(--paper); font-family:inherit; font-size:13.5px; color:var(--ink);
}
.input:focus{ background:#fff; border-color:var(--teal); }
button.input{ appearance:none; -webkit-appearance:none; cursor:pointer; }
button.input:hover{ border-color:var(--teal); }
[data-role="gvcn"] button.input:hover{ border-color:var(--amber); }
[data-role="gvcn"] .input:focus{ border-color:var(--amber); }
label.field-label{ font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; display:block; }
.field{ margin-bottom:14px; }

.badge{
  display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:999px;
  font-size:11px; font-weight:700;
}
.badge-teal{ background:var(--teal-tint); color:var(--teal-dark); }
.badge-amber{ background:var(--amber-tint); color:var(--amber-dark); }
.badge-rose{ background:var(--rose-tint); color:var(--rose); }
.badge-sage{ background:var(--sage-tint); color:var(--sage); }

table.data-table{ width:100%; border-collapse:collapse; font-size:13px; }
.data-table th{
  text-align:left; padding:9px 10px; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
  color:var(--ink-soft); border-bottom:1.5px solid var(--line); position:sticky; top:0; background:var(--card); z-index:2;
}
.data-table td{ padding:8px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
.data-table tr:hover td{ background:var(--paper-2); }
.score-cell{ width:56px; text-align:center; font-family:var(--font-mono); border:1px solid var(--line); border-radius:7px; padding:5px 2px; background:var(--paper); }
.score-cell:focus{ border-color:var(--teal); background:#fff; }

.adj-badge-btn{ border:none; background:transparent; cursor:pointer; padding:0; font-family:inherit; }
.score-popover{
  position:fixed; z-index:200; width:260px; background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius-m); box-shadow:var(--shadow-2); padding:12px;
}
.score-popover .adj-entry{
  display:flex; justify-content:space-between; align-items:center; gap:6px;
  padding:6px 0; border-bottom:1px solid var(--line-soft); font-size:12.5px;
}
.score-popover .adj-entry:last-of-type{ border-bottom:none; }
.score-popover .adj-add-row{ display:flex; gap:6px; margin-top:8px; }
.score-popover .adj-add-row input[type=number]{ width:78px; padding:9px 6px; text-align:center; flex:0 0 auto; }
.score-popover .adj-add-row input[type=text]{ flex:1; min-width:0; }

.empty-state{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:56px 20px; text-align:center; color:var(--ink-soft); gap:10px;
}
.empty-state svg{ width:48px; height:48px; opacity:.5; }

.modal-overlay{
  position:fixed; inset:0; background:rgba(27,42,74,.35); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;
}
.modal{
  background:var(--card); border-radius:var(--radius-l); box-shadow:var(--shadow-2);
  width:100%; max-width:480px; max-height:88vh; overflow-y:auto; padding:24px;
}
.modal.modal-wide{ max-width:720px; }
.modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }

.toast-wrap{ position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px; }
.toast{
  background:var(--ink); color:#fff; padding:11px 16px; border-radius:10px; font-size:13px; font-weight:600;
  box-shadow:var(--shadow-2); display:flex; align-items:center; gap:8px; animation:toast-in .2s ease;
}
.toast.rose{ background:var(--rose); }
.toast.sage{ background:var(--sage); }
@keyframes toast-in{ from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.tab-strip{ display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:18px; flex-wrap:wrap; }
.tab-strip button{
  border:none; background:transparent; padding:9px 4px; margin-right:14px; font-weight:700; font-size:13px;
  color:var(--ink-soft); cursor:pointer; border-bottom:2.5px solid transparent; margin-bottom:-1px;
}
.tab-strip button.active{ color:var(--teal); border-color:var(--teal); }
[data-role="gvcn"] .tab-strip button.active{ color:var(--amber); border-color:var(--amber); }

.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.stat-card{ padding:16px 18px; }
.stat-num{ font-family:var(--font-display); font-size:28px; font-weight:700; line-height:1; }
.stat-label{ font-size:12px; color:var(--ink-soft); margin-top:5px; font-weight:600; }

.divider-dash{ border:none; border-top:1.5px dashed var(--line); margin:18px 0; }

.spin{ width:16px; height:16px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:sp 0.7s linear infinite; }
@keyframes sp{ to{ transform:rotate(360deg);} }
.spin-dark{ border-color:var(--line); border-top-color:var(--teal); }

.confetti-burst{ position:absolute; inset:0; overflow:hidden; pointer-events:none; border-radius:inherit; }
.confetti-piece{ position:absolute; top:-10%; font-size:18px; animation:confetti-fall 1.3s ease-in forwards; }
@keyframes confetti-fall{
  0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:1; }
  100%{ transform:translateY(160px) translateX(var(--drift,0px)) rotate(340deg); opacity:0; }
}
@keyframes winner-pop{
  0%{ transform:scale(.7); opacity:0; }
  60%{ transform:scale(1.08); opacity:1; }
  100%{ transform:scale(1); opacity:1; }
}
.winner-pop{ animation:winner-pop .35s ease-out; }

/* Auth screen */
.auth-wrap{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background:
    radial-gradient(1200px 600px at 10% -10%, var(--teal-tint), transparent 60%),
    radial-gradient(1200px 600px at 100% 110%, var(--amber-tint), transparent 55%),
    var(--paper);
}
.auth-card{ width:100%; max-width:400px; padding:32px; }
.auth-logo{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
.auth-logo .brand-mark{ width:44px; height:44px; font-size:20px; }
.auth-title{ font-size:20px; margin-bottom:2px; }

@media print{
  .no-print{ display:none !important; }
  .topbar, .sidebar, .bottom-nav{ display:none !important; }
  .main{ padding:0; overflow:visible; }
  body{ background:#fff; }
}

@media (max-width: 880px){
  .sidebar{ display:none; }
  .bottom-nav{ display:flex; }
  .main{ padding:16px 14px 90px; }
  .grid-2, .grid-3{ grid-template-columns:1fr; }
  .class-switcher{ max-width:130px; }
  .brand-sub{ display:none; }
}

/* Điện thoại hẹp: topbar gốc (logo + chọn lớp + tab GVBM/GVCN + 3 nút
   icon) rộng hơn nhiều so với màn hình ~360-400px nên sẽ bị tràn/che
   khuất nếu giữ nguyên 1 hàng — xuống dòng thành 2 hàng gọn gàng, đồng
   thời tăng kích thước vùng chạm (checkbox, nút icon) cho dễ bấm bằng
   ngón tay. */
@media (max-width: 640px){
  .topbar{ flex-wrap:wrap; padding:10px 14px; gap:8px 10px; row-gap:8px; }
  .topbar-spacer{ display:none; }
  .brand{ order:1; }
  .topbar-actions{ order:2; margin-left:auto; }
  .class-switcher{ order:3; flex:1 1 100%; max-width:none; margin-left:0; }
  .role-tabs{ order:4; flex:1 1 100%; }
  .role-tab{ padding:8px 10px; font-size:12.5px; }
  .icon-btn{ width:40px; height:40px; }
  .modal-overlay{ padding:10px; }
  .modal{ padding:18px; border-radius:16px; }
  .data-table input[type=checkbox]{ width:18px; height:18px; }
  /* Cỡ chữ input dưới 16px khiến Safari trên iPhone tự động zoom to mỗi khi bấm vào ô nhập
     liệu (rất khó chịu, người dùng phải tự zoom out lại) — tăng lên 16px chỉ trên di động để
     tránh hành vi này, không đổi cỡ chữ trên máy tính. */
  .input, select.input, textarea.input{ font-size:16px; }
}

</style>
</head>
<body>

<!-- ============================ AUTH / SETUP SCREEN ============================ -->
<div id="auth-wrap" class="auth-wrap"></div>

<!-- ============================ MAIN APP SHELL ============================ -->
<div id="app">
  <div class="topbar no-print">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div>
        <div class="brand-name">Sổ Điểm &amp; Sổ Chủ Nhiệm</div>
        <div class="brand-sub" id="user-email-label"></div>
      </div>
    </div>

    <div class="class-switcher no-print" id="class-switcher">
      <select id="class-select"></select>
    </div>

    <div class="topbar-spacer"></div>

    <div class="role-tabs no-print" id="role-tabs" data-active="gvbm">
      <div class="tab-pill"></div>
      <button class="role-tab active" data-role-btn="gvbm">📗 GVBM</button>
      <button class="role-tab" data-role-btn="gvcn">📘 GVCN</button>
    </div>

    <div class="topbar-actions no-print">
      <button class="icon-btn" id="btn-sync-status" title="Trạng thái đồng bộ">☁️</button>
      <button class="icon-btn" id="btn-settings" title="Cài đặt">⚙️</button>
      <button class="icon-btn" id="btn-logout" title="Đăng xuất">⏻</button>
    </div>
  </div>

  <div class="credit-bar no-print">
    <span class="credit-bar-text">✨ Sản phẩm được phát triển bởi cô giáo Đàm Thị Lan Anh — Trường THPT chuyên Chu Văn An, Hà Nội ✨</span>
  </div>

  <div class="shell">
    <div class="sidebar no-print" id="sidebar" data-role="gvbm"></div>
    <div class="main" id="main-content"></div>
  </div>

  <div class="bottom-nav no-print" id="bottom-nav" data-role="gvbm"></div>
</div>

<div id="modal-root"></div>
<div class="toast-wrap no-print" id="toast-wrap"></div>

<script>
'use strict';
/* ==========================================================================
   0. UTILITIES

const $  = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const el = (tag, attrs={}, ...children) => {
  const n = document.createElement(tag);
  for(const k in attrs){
    if(k === 'class') n.className = attrs[k];
    else if(k === 'html') n.innerHTML = attrs[k];
    else if(k.startsWith('on') && typeof attrs[k]==='function') n.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k] !== undefined && attrs[k] !== null) n.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c=>{ if(c===null||c===undefined) return; n.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return n;
};
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const escapeHtml = (s='') => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const normName = (s='') => String(s).trim().toLowerCase().replace(/\s+/g,' ');
const fmtDate = (d) => { const dt = (d instanceof Date)? d : new Date(d); return dt.toLocaleDateString('vi-VN'); };
// Ngày sinh học sinh được LƯU dạng ISO "YYYY-MM-DD" (từ buildDobPicker) —
// hàm này chỉ đổi cách HIỂN THỊ sang "DD-MM-YYYY", đọc thẳng chuỗi, không
// qua Date() để tránh bị lệch ngày do múi giờ.
const fmtDob = (iso) => {
  if(!iso) return '—';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso).trim());
  if(!m) return iso;
  return `${m[3]}-${m[2]}-${m[1]}`;
};
const todayStr = () => new Date().toISOString().slice(0,10);
const pad2 = (n) => String(n).padStart(2,'0');
// Định dạng "07/09/2026" (luôn đủ 2 chữ số ngày/tháng) — khác fmtDate() ở trên vì
// toLocaleDateString('vi-VN') có thể bỏ số 0 đầu tuỳ trình duyệt. Dùng cho các ô hiển thị TUẦN.
const fmtDateSlash = (d) => { const dt=(d instanceof Date)?d:new Date(d); return `${pad2(dt.getDate())}/${pad2(dt.getMonth()+1)}/${dt.getFullYear()}`; };
// Date -> chuỗi ISO "YYYY-MM-DD" theo giờ ĐỊA PHƯƠNG (không dùng toISOString() vì nó quy đổi
// sang UTC, có thể lệch ngày ở các múi giờ xa UTC).
const isoOfLocalDate = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const round1 = (n) => Math.round(n*10)/10;
const clampScore = (v) => { v = parseFloat(v); if(isNaN(v)) return null; return Math.max(0, Math.min(10, v)); };

let _celebAudioCtx = null;
function playCelebrationSound(){
  try{
    _celebAudioCtx = _celebAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = _celebAudioCtx;
    if(ctx.state==='suspended') ctx.resume();
    const now = ctx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.5]; // Đô-Mi-Sol-Đô, giai điệu "ta-da" rộn ràng
    notes.forEach((freq, i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const t0 = now + i*0.09;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.25, t0+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t0+0.3);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0); osc.stop(t0+0.32);
    });
  }catch(e){ /* im lặng nếu trình duyệt chặn audio tự phát */ }
}

}

function toast(msg, kind=''){
  const wrap = $('#toast-wrap');
  const t = el('div', {class:'toast '+kind}, msg);
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(), 300); }, 2600);
}
// Toast có nút "↩️ Hoàn tác" — dùng cho các thao tác xoá: KHÔNG xoá ngay lập tức,
// chỉ ẩn/khoá tạm trên giao diện rồi đợi `ms` để người dùng kịp bấm Hoàn tác nếu
// lỡ tay. Hết giờ mà không hoàn tác thì mới thực sự gọi onCommit() (vd: xoá Firestore).
function toastUndo(msg, onCommit, onUndo, ms=6000){
  const wrap = $('#toast-wrap');
  let done = false;
  const t = el('div', {class:'toast rose', style:'display:flex; align-items:center; gap:10px'},
    el('span',{}, msg),
    el('button',{class:'btn btn-ghost btn-sm', style:'padding:4px 10px; white-space:nowrap; flex-shrink:0', onclick:()=>{
      if(done) return; done = true; clearTimeout(timer);
      t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(), 300);
      if(onUndo) onUndo();
    }}, '↩️ Hoàn tác'));
  wrap.appendChild(t);
  const timer = setTimeout(()=>{
    if(done) return; done = true;
    t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(), 300);
    if(onCommit) onCommit();
  }, ms);
}
async function copyText(text, okMsg){
  okMsg = okMsg || 'Đã sao chép';
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      toast(okMsg, 'sage');
      return;
    }
    throw new Error('Clipboard API không khả dụng');
  }catch(e){
    // Dự phòng: nhiều trình duyệt di động (đặc biệt Chrome Android khi trang
    // không ở "secure context" hoặc thiếu quyền) chặn Clipboard API — dùng
    // cách cũ hơn (textarea ẩn + execCommand) để vẫn sao chép được.
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly','');
      ta.style.position = 'fixed';
      ta.style.top = '-9999px';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if(ok){ toast(okMsg, 'sage'); return; }
      throw new Error('execCommand copy thất bại');
    }catch(e2){
      toast('Trình duyệt chặn tự sao chép — hãy tự chạm giữ vào đoạn text để chọn & sao chép thủ công', 'rose');
    }
  }
}

/* ==========================================================================
   3. FIREBASE BOOTSTRAP
   ========================================================================== */
function initFirebase(cfg){
  try{
    if(firebase.apps.length) firebase.app().delete().catch(()=>{});
  }catch(e){}
  firebase.initializeApp(cfg);
  auth = firebase.auth();
  db = firebase.firestore();
  try{ storage = firebase.storage(); }catch(e){ storage = null; }
  try{ db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
  auth.onAuthStateChanged(onAuthChanged);
}

function onAuthChanged(user){
  State.user = user;
  if(user){
    $('#auth-wrap').style.display = 'none';
    $('#app').classList.add('ready');
    $('#user-email-label').textContent = user.email || user.uid;
    ensureTeacherDoc(user).then(loadMyClasses).catch(err=>{
      console.error('Lỗi tải danh sách lớp:', err);
      renderFatalError(err);
    });
    subscribeTeacherDoc(user);
  } else {
    // Tắt hết các listener đang lắng nghe dữ liệu (học sinh, điểm, điểm danh…)
    // TRƯỚC khi coi như đã đăng xuất — nếu không, chúng sẽ tiếp tục cố đọc
    // dữ liệu sau khi mất quyền và bị Firestore Rules từ chối hàng loạt
    // (permission-denied), gây ra một loạt thông báo lỗi thừa như vừa thấy.
    detachListeners();
    if(State.teacherUnsub){ try{ State.teacherUnsub(); }catch(e){} State.teacherUnsub = null; }
    State.classId = null; State.klass = null; State.teacherDoc = null;
    $('#app').classList.remove('ready');
    renderAuthScreen();
  }
}

function subscribeTeacherDoc(user){
  if(State.teacherUnsub){ try{ State.teacherUnsub(); }catch(e){} State.teacherUnsub = null; }
  State.teacherUnsub = db.collection('teachers').doc(user.uid).onSnapshot(snap=>{
    State.teacherDoc = snap.exists ? {id:snap.id, ...snap.data()} : null;
    renderAll();
  }, err=> console.warn('teacher doc snapshot', err));
}
function ensureTeacherDoc(user){
  const ref = db.collection('teachers').doc(user.uid);
  return ref.get().then(snap=>{
    if(!snap.exists){
      return ref.set({ name: user.email ? user.email.split('@')[0] : 'Giáo viên', email: user.email||'', createdAt: Date.now() });
    }
  }).catch(err=> console.warn('teacher doc', err));
}

function buildFirebaseSetupCard(){
  const card = el('div', {class:'card auth-card'});
  card.appendChild(el('div', {class:'auth-logo'}, el('div',{class:'brand-mark'},'S'),
    el('div', {}, el('div',{class:'brand-name'},'Thiết lập kho lưu trữ'), el('div',{class:'muted', style:'font-size:12px'},'Bước 1/1 — chỉ làm một lần'))));
  card.appendChild(el('p', {class:'muted', style:'font-size:13px; line-height:1.6; margin-bottom:16px'},
    'Ứng dụng lưu dữ liệu trên một dự án Firebase miễn phí do chính thầy/cô sở hữu — để đồng bộ nhiều thiết bị và không ai khác truy cập được. Dán 6 dòng cấu hình "firebaseConfig" (lấy trong Firebase Console → Project settings → SDK setup) vào ô bên dưới.'));

  const ta = el('textarea', {class:'input', rows:8, placeholder:'{\n  apiKey: "...",\n  authDomain: "...",\n  projectId: "...",\n  storageBucket: "...",\n  messagingSenderId: "...",\n  appId: "..."\n}'});
  card.appendChild(el('div', {class:'field'}, el('label',{class:'field-label'},'Firebase config'), ta));

  const btn = el('button', {class:'btn btn-primary', style:'width:100%; margin-top:4px'}, 'Lưu & tiếp tục');
  btn.addEventListener('click', ()=>{
    let raw = ta.value.trim();
    if(!raw){ toast('Vui lòng dán cấu hình Firebase', 'rose'); return; }
    try{
      // Bỏ phần "const firebaseConfig =" hoặc "export default" nếu người dùng lỡ dán cả dòng đó
      raw = raw.replace(/^\s*(export\s+default|const|let|var)\s+\w+\s*=\s*/i, '').trim();
      // Bỏ dấu chấm phẩy ở cuối nếu có
      raw = raw.replace(/;\s*$/,'').trim();
      if(!raw.startsWith('{')) raw = '{'+raw+'}';
      // Dùng trình thông dịch JS thật để đọc object literal, thay vì regex — vì regex đơn giản
      // sẽ làm hỏng các giá trị có chứa dấu hai chấm bên trong (ví dụ appId dạng "1:xxxx:web:xxxx").
      const parsed = Function('"use strict"; return (' + raw + ');')();
      if(!parsed || typeof parsed !== 'object') throw new Error('not an object');
      if(!parsed.apiKey || !parsed.projectId){ throw new Error('missing fields'); }
      LocalCfg.firebase = parsed;
      toast('Đã lưu cấu hình', 'sage');
      initFirebase(parsed);
      renderAuthScreen();
    }catch(e){
      toast('Cấu hình chưa đúng định dạng, kiểm tra lại', 'rose');
    }
  });
  card.appendChild(btn);
  card.appendChild(el('p', {class:'muted', style:'font-size:11.5px; margin-top:14px; line-height:1.6'},
    '💡 Chưa có dự án Firebase? Vào firebase.google.com → tạo dự án miễn phí → Build → Firestore Database (bắt đầu ở chế độ Production) → Authentication → bật "Email/Password". Nhấn nút cài đặt (⚙️) trong app sau này để xem mẫu Firestore Rules bảo mật.'));
  return card;
}

function buildLoginCard(){
  const card = el('div', {class:'card auth-card'});
  card.appendChild(el('div', {class:'auth-logo'}, el('div',{class:'brand-mark'},'S'),
    el('div', {}, el('div',{class:'brand-name auth-title'},'Sổ Điểm & Sổ Chủ Nhiệm'), el('div',{class:'muted', style:'font-size:12px'},'Đăng nhập để tiếp tục'))));
  card.appendChild(el('div', {class:'credit-bar-text', style:'display:block; margin:2px 0 16px; text-align:center'},
    '✨ Sản phẩm được phát triển bởi cô giáo Đàm Thị Lan Anh — Trường THPT chuyên Chu Văn An, Hà Nội ✨'));

  let mode = 'login';
  const emailIn = el('input', {class:'input', type:'email', placeholder:'email@truong.edu.vn', autocomplete:'email'});
  const passIn = el('input', {class:'input', type:'password', placeholder:'Mật khẩu (≥ 6 ký tự)', autocomplete:'current-password'});
  const nameIn = el('input', {class:'input', type:'text', placeholder:'Họ tên giáo viên'});
  const nameField = el('div', {class:'field', style:'display:none'}, el('label',{class:'field-label'},'Họ tên'), nameIn);

  const form = el('div', {},
    el('div', {class:'field'}, el('label',{class:'field-label'},'Email'), emailIn),
    nameField,
    el('div', {class:'field'}, el('label',{class:'field-label'},'Mật khẩu'), passIn),
  );
  card.appendChild(form);

  const submitBtn = el('button', {class:'btn btn-primary', style:'width:100%'}, 'Đăng nhập');
  const switchBtn = el('button', {class:'btn btn-ghost', style:'width:100%; margin-top:8px'}, 'Chưa có tài khoản? Đăng ký');
  const forgotBtn = el('button', {class:'btn btn-ghost', style:'width:100%; margin-top:4px; font-size:12.5px'}, 'Quên mật khẩu?');
  card.appendChild(submitBtn);
  card.appendChild(switchBtn);
  card.appendChild(forgotBtn);

  switchBtn.addEventListener('click', ()=>{
    mode = mode==='login' ? 'signup' : 'login';
    submitBtn.textContent = mode==='login' ? 'Đăng nhập' : 'Tạo tài khoản';
    switchBtn.textContent = mode==='login' ? 'Chưa có tài khoản? Đăng ký' : 'Đã có tài khoản? Đăng nhập';
    nameField.style.display = mode==='signup' ? 'block' : 'none';
    forgotBtn.style.display = mode==='login' ? 'block' : 'none';
  });

  forgotBtn.addEventListener('click', async ()=>{
    const email = emailIn.value.trim();
    if(!email){ toast('Nhập email trước, rồi bấm "Quên mật khẩu?"', 'rose'); emailIn.focus(); return; }
    forgotBtn.disabled = true;
    try{
      await auth.sendPasswordResetEmail(email);
      toast('Đã gửi email đặt lại mật khẩu — kiểm tra hộp thư của thầy/cô', 'sage');
    }catch(e){
      toast(friendlyAuthError(e), 'rose');
    }
    forgotBtn.disabled = false;
  });

  submitBtn.addEventListener('click', async ()=>{
    const email = emailIn.value.trim(), pass = passIn.value;
    if(!email || !pass){ toast('Nhập email và mật khẩu', 'rose'); return; }
    submitBtn.disabled = true;
    try{
      if(mode==='login'){
        await auth.signInWithEmailAndPassword(email, pass);
      } else {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        await db.collection('teachers').doc(cred.user.uid).set({ name: nameIn.value.trim()||email.split('@')[0], email, createdAt: Date.now() });
      }
    }catch(e){
      toast(friendlyAuthError(e), 'rose');
    }
    submitBtn.disabled = false;
  });

  card.appendChild(el('button', {class:'btn btn-ghost', style:'width:100%; margin-top:14px; font-size:11.5px', onclick: ()=>{
    if(confirm('Đổi sang dự án Firebase khác? (Không xoá dữ liệu, chỉ đổi kết nối trên máy này)')){
      localStorage.removeItem('sd_firebase_cfg');
      renderAuthScreen();
    }
  }}, 'Đổi dự án lưu trữ khác'));

  return card;
}
function friendlyAuthError(e){
  const c = e.code||'';
  if(c.includes('user-not-found')) return 'Không tìm thấy tài khoản này';
  if(c.includes('wrong-password')||c.includes('invalid-credential')) return 'Sai mật khẩu';
  if(c.includes('email-already-in-use')) return 'Email đã được đăng ký';
  if(c.includes('weak-password')) return 'Mật khẩu quá ngắn (tối thiểu 6 ký tự)';
  if(c.includes('invalid-email')) return 'Email không hợp lệ';
  if(c.includes('missing-email')) return 'Vui lòng nhập email';
  if(c.includes('too-many-requests')) return 'Đã gửi quá nhiều lần, vui lòng thử lại sau ít phút';
  return 'Có lỗi xảy ra: ' + (e.message||c);
}

/* ==========================================================================
   5. CLASS LOADING & SWITCHING
   ========================================================================== */
async function loadMyClasses(){
  const uidv = State.user.uid;
  let asGvcn, asGvbm;
  try{
    [asGvcn, asGvbm] = await Promise.all([
      db.collection('classes').where('gvcnUid','==',uidv).get(),
      db.collection('classes').where('gvbmUids','array-contains',uidv).get(),
    ]);
  }catch(err){
    console.error('Lỗi truy vấn danh sách lớp:', err);
    renderFatalError(err);
    return;
  }
  const map = new Map();
  asGvcn.forEach(d=> map.set(d.id, {id:d.id, ...d.data(), _myRole:'gvcn'}));
  asGvbm.forEach(d=> { if(!map.has(d.id)) map.set(d.id, {id:d.id, ...d.data(), _myRole:'gvbm'}); else map.get(d.id)._alsoGvbm = true; });
  State.classes = Array.from(map.values()).sort((a,b)=> (a.name||'').localeCompare(b.name||''));

  renderClassSwitcher();

  if(!State.classes.length){
    State.classId = null;
    renderNoClassState();
    return;
  }
  if(!State.classId || !map.has(State.classId)) State.classId = State.classes[0].id;
  selectClass(State.classId);
}

function renderClassSwitcher(){
  const sel = $('#class-select');
  sel.innerHTML = '';
  State.classes.forEach(c=>{
    sel.appendChild(el('option', {value:c.id}, `${c.name}${c._myRole==='gvcn'?' (CN)':''}`));
  });
  sel.appendChild(el('option', {value:'__new__'}, '+ Tạo / tham gia lớp…'));
  sel.value = State.classId || '';

function selectClass(classId){
  State.classId = classId;
  State.classes.forEach(c=>{ if(c.id===classId) State.klass = c; });
  detachListeners();
  attachClassListeners(classId);
  renderClassSwitcher();
  setRole(State.role);
}

function detachListeners(){ State.unsub.forEach(u=>{ try{u();}catch(e){} }); State.unsub = []; }

function attachClassListeners(classId){
  const push = (u)=> State.unsub.push(u);
  const onErr = (label)=> (err)=>{ console.error('Lỗi đồng bộ '+label+':', err); toast('Lỗi đồng bộ '+label+': '+describeError(err), 'rose'); };

  push(db.collection('classes').doc(classId).onSnapshot(snap=>{
    if(snap.exists){ State.klass = {id:classId, ...snap.data()}; renderAll(); }
  }, onErr('thông tin lớp')));

  push(db.collection('classes').doc(classId).collection('students').onSnapshot(snap=>{
    const list = snap.docs.map(d=>({id:d.id, ...d.data()}));
    // Sắp theo đúng thứ tự đã nhập (orderSeq). Học sinh cũ chưa có orderSeq
    // (thêm từ trước khi có tính năng này) rơi về theo createdAt, rồi theo
    // tên — không bao giờ bị rớt khỏi danh sách vì đây là sort ở client,
    // không phải orderBy() trên Firestore.
    list.sort((a,b)=>{
      const av = (a.orderSeq!=null) ? a.orderSeq : (a.createdAt||0);
      const bv = (b.orderSeq!=null) ? b.orderSeq : (b.createdAt||0);
      if(av !== bv) return av - bv;
      return String(a.name||'').localeCompare(String(b.name||''), 'vi');
    });
    State.students = list;
    renderAll();
  }, onErr('học sinh')));

  push(db.collection('classes').doc(classId).collection('subjects').onSnapshot(snap=>{
    State.subjects = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(!State.mySubjectId || !State.subjects.find(s=>s.id===State.mySubjectId)){
      const mine = State.subjects.find(s=>s.teacherUid === State.user.uid);
      State.mySubjectId = mine ? mine.id : (State.subjects[0] ? State.subjects[0].id : null);
    }
    renderAll();
  }, onErr('môn học')));

  push(db.collection('classes').doc(classId).collection('gradebook').onSnapshot(snap=>{
    const gb = {};
    snap.docs.forEach(d=> gb[d.id] = {id:d.id, ...d.data()});
    State.gradebook = gb;
    renderAll();
  }, onErr('điểm số')));

  push(db.collection('classes').doc(classId).collection('attendance').onSnapshot(snap=>{
    const at = {};
    snap.docs.forEach(d=> at[d.id] = d.data());
    State.attendance = at;
    renderAll();
  }, onErr('điểm danh')));

  push(db.collection('classes').doc(classId).collection('conduct').orderBy('date','desc').onSnapshot(snap=>{
    State.conduct = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderAll();
  }, onErr('vi phạm/tuyên dương')));

  push(db.collection('classes').doc(classId).collection('finalScores').onSnapshot(snap=>{
    const fs = {};
    snap.docs.forEach(d=> fs[d.id] = d.data());
    State.finalScores = fs;
    renderAll();
  }, onErr('bảng điểm tổng hợp')));

  push(db.collection('classes').doc(classId).collection('logbook').orderBy('date','desc').onSnapshot(snap=>{
    State.logbook = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderAll();
  }, onErr('sổ đầu bài')));

  push(db.collection('classes').doc(classId).collection('tasks').orderBy('date','desc').onSnapshot(snap=>{
    State.tasks = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderAll();
  }, onErr('phân công nhiệm vụ')));
}

function describeError(err){
  const msg = (err && (err.message||String(err))) || 'Lỗi không xác định';
  const code = (err && err.code) || '';
  if(code.includes('permission-denied') || /insufficient permissions/i.test(msg)){
    return 'Bị từ chối quyền truy cập dữ liệu (permission-denied). Nguyên nhân thường gặp: Firestore Rules trên Firebase Console đang chặn nhầm tài khoản này — vào ⚙️ Cài đặt → Bảo mật, dán lại đúng đoạn Rules mới nhất rồi Publish lại trên Firebase Console.';
  }
  if(code.includes('unavailable') || /network/i.test(msg)){
    return 'Không kết nối được tới máy chủ — kiểm tra lại mạng Internet rồi thử lại.';
  }
  if(/indexeddb|idb/i.test(msg)){
    return 'Trình duyệt chặn IndexedDB khi mở file trực tiếp từ ổ đĩa (file://). Hãy thử mở file này qua một máy chủ web cục bộ (VD: VS Code Live Server) hoặc host lên Firebase Hosting/Netlify thay vì bấm đúp mở file.';
  }
  return msg;
}

function renderFatalError(err){
  const main = $('#main-content');
  if(main) main.innerHTML = '';
  const sb = $('#sidebar'); if(sb) sb.innerHTML = '';
  const bn = $('#bottom-nav'); if(bn) bn.innerHTML = '';

  main.appendChild(el('div', {class:'empty-state', style:'padding-top:60px; max-width:560px; margin:0 auto'},

    el('button', {class:'btn btn-primary', onclick: ()=> location.reload()}, '↻ Tải lại trang')
  ));
}

/* ==========================================================================
   8. GVBM — GRADEBOOK ("Bảng điểm")
   ========================================================================== */
function calcAvg(gb, subj){
  if(!gb) return null;
  const tx = (gb.tx||[]).filter(v=> v!==null && v!==undefined);
  const gk = (gb.gk!==undefined) ? gb.gk : null;
  const ck = (gb.ck!==undefined) ? gb.ck : null;
  const weight = tx.length + (gk!=null?2:0) + (ck!=null?3:0);
  if(weight===0) return null;
  const sum = tx.reduce((a,b)=>a+b,0) + (gk!=null?gk*2:0) + (ck!=null?ck*3:0);
  return round1(sum/weight);
}
function gbKey(subjectId, studentId){ return subjectId+'_'+studentId; }
function saveGb(subjectId, studentId, patch){
  const key = gbKey(subjectId, studentId);
  const ref = db.collection('classes').doc(State.classId).collection('gradebook').doc(key);
  ref.set({ classId: State.classId, subjectId, studentId, updatedAt: Date.now(), ...patch }, {merge:true})
    .catch(e=> toast('Lỗi lưu điểm: '+e.message, 'rose'));
}

/* ==========================================================================
   8. GVBM — TỔNG QUAN NHIỀU LỚP (cùng lúc dạy nhiều lớp, VD 12A + 12B + 11C)
   ========================================================================== */
async function loadGvbmOverview(){
  const rows = [];
  for(const c of State.classes){
    let subjSnap;
    try{ subjSnap = await db.collection('classes').doc(c.id).collection('subjects').where('teacherUid','==',State.user.uid).get(); }
    catch(e){ continue; }
    if(subjSnap.empty){
      // Lớp đã tham gia nhưng CHƯA thêm môn nào — vẫn hiện thẻ để nhắc nhở,
      // thay vì âm thầm bỏ qua khiến "Tổng quan" thiếu lớp.
      rows.push({classId:c.id, className:c.name, isHomeroom: c._myRole==='gvcn', subject:null, totalStudents:0, overallAvg:null, weakCount:0, enteredCount:0});
      continue;
    }
    const studentsSnap = await db.collection('classes').doc(c.id).collection('students').get();
    const totalStudents = studentsSnap.size;
    for(const subjDoc of subjSnap.docs){
      const subj = {id:subjDoc.id, ...subjDoc.data()};
      const gbSnap = await db.collection('classes').doc(c.id).collection('gradebook').where('subjectId','==',subj.id).get();
      const gbList = gbSnap.docs.map(d=>d.data());
      const avgs = gbList.map(gb=>calcAvg(gb, subj)).filter(v=>v!=null);
      const overallAvg = avgs.length ? round1(avgs.reduce((a,b)=>a+b,0)/avgs.length) : null;
      const weakCount = avgs.filter(v=>v<5).length;
      const enteredCount = gbList.filter(gb=> (gb.tx&&gb.tx.some(v=>v!=null)) || gb.gk!=null || gb.ck!=null).length;
      rows.push({classId:c.id, className:c.name, isHomeroom: c._myRole==='gvcn', subject:subj, totalStudents, overallAvg, weakCount, enteredCount});
    }
  }
  return rows;
}

  const searchIn = el('input',{class:'input', placeholder:'🔍 Tìm học sinh theo tên…', style:'max-width:280px; margin-bottom:12px'});

  const wrap = el('div', {class:'card', style:'overflow-x:auto'});
  const table = el('table', {class:'data-table'});
  const thead = el('thead', {}, el('tr', {},
    el('th',{},'#'), el('th',{},'Học sinh'),
    ...Array.from({length:txCount}, (_,i)=> el('th',{style:'text-align:center'}, `TX${i+1}`)),
    el('th',{style:'text-align:center'},'GK'), el('th',{style:'text-align:center'},'CK'),
    el('th',{style:'text-align:center'},'Chuyên cần'), el('th',{style:'text-align:center'},'Điểm cộng'), el('th',{style:'text-align:center'},'Điểm trừ'),
    el('th',{style:'text-align:center'},'TB môn'), el('th',{})
  ));
  const tbody = el('tbody');
  table.appendChild(thead); table.appendChild(tbody);
  wrap.appendChild(table);
  main.appendChild(wrap);

  function renderRows(){
    tbody.innerHTML = '';
    const term = stripDiacritics(searchIn.value.trim());
    const list = term ? State.students.filter(s=> stripDiacritics(s.name).includes(term)) : State.students;
    if(!list.length){
      tbody.appendChild(el('tr',{}, el('td',{colspan: txCount+8, class:'muted', style:'text-align:center; padding:16px'}, 'Không tìm thấy học sinh nào phù hợp.')));
      return;
    }
    list.forEach(stu=>{
    const idx = State.students.indexOf(stu); // số thứ tự giữ theo danh sách gốc, không đổi theo kết quả lọc
    const gb = State.gradebook[gbKey(subj.id, stu.id)] || {tx:[], gk:null, ck:null, cc:null, adj:[]};
    const avg = calcAvg(gb, subj);
    const tr = el('tr', {});
    tr.appendChild(el('td',{}, String(idx+1)));
    tr.appendChild(el('td',{}, el('strong',{},stu.name)));
    for(let i=0;i<txCount;i++){
      const val = (gb.tx&&gb.tx[i]!=null) ? gb.tx[i] : '';
      const input = el('input', {class:'score-cell', type:'number', min:'0', max:'10', step:'0.1', value:val});
      input.addEventListener('change', ()=>{
        const arr = (gb.tx||[]).slice(); while(arr.length<txCount) arr.push(null);
        arr[i] = clampScore(input.value);
        saveGb(subj.id, stu.id, {tx:arr});
      });
      tr.appendChild(el('td',{}, input));
    }
    ['gk','ck'].forEach(k=>{
      const input = el('input', {class:'score-cell', type:'number', min:'0', max:'10', step:'0.1', value: gb[k]!=null?gb[k]:''});
      input.addEventListener('change', ()=> saveGb(subj.id, stu.id, {[k]: clampScore(input.value)}));
      tr.appendChild(el('td',{}, input));
    });
    const ccInput = el('input', {class:'score-cell', type:'number', min:'0', max:'10', step:'0.1', value: gb.cc!=null?gb.cc:''});
    ccInput.addEventListener('change', ()=> saveGb(subj.id, stu.id, {cc: clampScore(ccInput.value)}));
    tr.appendChild(el('td',{}, ccInput));

    const isAdjPlus = a=> a.kind ? a.kind==='plus' : a.value>0;
    const isAdjMinus = a=> a.kind ? a.kind==='minus' : a.value<0;
    const adjPlusSum = round1((gb.adj||[]).filter(isAdjPlus).reduce((a,b)=>a+(b.value||0),0));
    const adjMinusSum = round1((gb.adj||[]).filter(isAdjMinus).reduce((a,b)=>a+(b.value||0),0));
    const plusBtn = el('button',{class:'adj-badge-btn'}, el('span',{class:'badge badge-sage'}, '+'+adjPlusSum));
    plusBtn.addEventListener('click', (e)=>{ e.stopPropagation(); openAdjPopover(plusBtn, subj, stu, gb, 'plus'); });
    tr.appendChild(el('td',{style:'text-align:center'}, plusBtn));
    const minusBtn = el('button',{class:'adj-badge-btn'}, el('span',{class:'badge badge-rose'}, String(adjMinusSum)));
    minusBtn.addEventListener('click', (e)=>{ e.stopPropagation(); openAdjPopover(minusBtn, subj, stu, gb, 'minus'); });
    tr.appendChild(el('td',{style:'text-align:center'}, minusBtn));

    tr.appendChild(el('td',{style:'text-align:center'}, avg!=null ? el('strong',{class: avg<5?'':'', style:'font-family:var(--font-mono); color:'+(avg<5?'var(--rose)':'var(--teal)')}, avg.toFixed(1)) : el('span',{class:'muted'},'—')));
    tr.appendChild(el('td',{}, el('button',{class:'icon-btn', title:'Nhận xét AI', onclick:()=> openAiCommentModal(stu, {subject:subj, gb, avg})}, '✨')));
    tbody.appendChild(tr);
    });
  }
  searchIn.addEventListener('input', renderRows);
  renderRows();
}

function adjustTxCount(subj, delta){
  const cur = subj.txCount || 3;
  const next = Math.max(1, Math.min(10, cur+delta));
  db.collection('classes').doc(State.classId).collection('subjects').doc(subj.id).update({txCount: next});
}

async function deleteSubject(subj){
  if(!confirm(`Xoá môn "${subj.name}"? Toàn bộ điểm số đã nhập của môn này trong lớp ${State.klass.name} sẽ bị xoá vĩnh viễn.`)) return;
  try{
    const gbSnap = await db.collection('classes').doc(State.classId).collection('gradebook').where('subjectId','==',subj.id).get();
    const batch = db.batch();
    gbSnap.docs.forEach(d=> batch.delete(d.ref));
    batch.delete(db.collection('classes').doc(State.classId).collection('subjects').doc(subj.id));
    await batch.commit();
    if(State.mySubjectId === subj.id){
      const remaining = State.subjects.filter(s=> s.id!==subj.id && s.teacherUid===State.user.uid);
      State.mySubjectId = remaining[0] ? remaining[0].id : null;
    }
    toast('Đã xoá môn học', 'sage');
    renderSidebar(); renderMain();
  }catch(e){
    toast('Lỗi xoá môn: '+e.message, 'rose');
  }
}

function closeAdjPopover(){
  if(_adjPopoverEl){ _adjPopoverEl.remove(); _adjPopoverEl = null; }
  if(_adjPopoverOutsideHandler){ document.removeEventListener('mousedown', _adjPopoverOutsideHandler, true); _adjPopoverOutsideHandler = null; }
  document.removeEventListener('keydown', _adjPopoverEscHandler, true);
}
function _adjPopoverEscHandler(e){ if(e.key==='Escape') closeAdjPopover(); }
let _adjPopoverEl = null, _adjPopoverOutsideHandler = null;

// Dropdown nhỏ neo cạnh nút bấm, cho phép thêm/xoá nhiều lần điểm cộng hoặc điểm trừ
// cho 1 học sinh mà không cần mở modal toàn màn hình.
function openAdjPopover(anchorEl, subj, stu, gbRef, kind){
  closeAdjPopover();
  let localAdj = (gbRef.adj || []).slice();
  const isPlus = kind==='plus';
  const pop = el('div', {class:'score-popover'});
  pop.appendChild(el('div',{style:'font-weight:700; font-size:12.5px; margin-bottom:6px'}, (isPlus?'➕ Điểm cộng — ':'➖ Điểm trừ — ')+stu.name));

  const listWrap = el('div', {class:'adj-list'});
  const valIn = el('input',{class:'input', type:'number', min:'0', step:'0.25', placeholder:'Điểm'});
  const labelIn = el('input',{class:'input', type:'text', placeholder:'Lý do'});
  const addRow = el('div',{class:'adj-add-row'}, valIn, labelIn);
  const addBtn = el('button',{class:'btn btn-primary btn-sm', style:'width:100%; margin-top:8px'}, '+ Thêm');

  function renderList(){
    listWrap.innerHTML = '';
    const entries = localAdj.map((a,i)=>({...a, _idx:i})).filter(a=> a.kind ? a.kind===kind : (isPlus ? a.value>0 : a.value<0));
    if(!entries.length){ listWrap.appendChild(el('div',{class:'muted', style:'font-size:12px; padding:4px 0'}, 'Chưa có mục nào.')); }
    entries.forEach(a=>{
      const row = el('div',{class:'adj-entry'});
      row.appendChild(el('div',{}, el('strong',{},(a.value>0?'+':'')+a.value), a.label? el('span',{style:'margin-left:6px; color:var(--ink-soft)'}, a.label): null));
      row.appendChild(el('button',{class:'icon-btn', onclick:()=>{
        localAdj.splice(a._idx,1);
        saveGb(subj.id, stu.id, {adj:localAdj});
        renderList();
      }}, '🗑️'));
      listWrap.appendChild(row);
    });
  }
  addBtn.addEventListener('click', ()=>{
    const raw = valIn.value.trim();
    let mag = 0;
    if(raw !== ''){
      mag = parseFloat(raw);
      if(isNaN(mag) || mag<0){ toast('Điểm không hợp lệ','rose'); return; }
    }
    const label = labelIn.value.trim();
    if(mag===0 && !label){ toast('Nhập điểm hoặc lý do','rose'); return; }
    localAdj.push({kind, value: isPlus?mag:-mag, label, date:Date.now()});
    saveGb(subj.id, stu.id, {adj:localAdj});
    valIn.value=''; labelIn.value=''; valIn.focus();
    renderList();
  });

  pop.appendChild(listWrap); pop.appendChild(addRow);
  pop.appendChild(el('div',{class:'muted', style:'font-size:11px; margin:4px 0 2px'}, 'Điểm để trống cũng được, miễn có lý do (hoặc ngược lại).'));
  pop.appendChild(addBtn);
  renderList();
  document.body.appendChild(pop);

  const r = anchorEl.getBoundingClientRect();
  const popW = 260;
  let left = Math.min(Math.max(8, r.left), window.innerWidth - popW - 8);
  pop.style.left = left+'px';
  pop.style.top = (r.bottom + 6)+'px';
  requestAnimationFrame(()=>{
    const ph = pop.getBoundingClientRect().height;
    if(r.bottom + 6 + ph > window.innerHeight - 8) pop.style.top = Math.max(8, r.top - ph - 6)+'px';
  });

  _adjPopoverEl = pop;
  _adjPopoverOutsideHandler = (e)=>{ if(!pop.contains(e.target) && e.target!==anchorEl) closeAdjPopover(); };
  document.addEventListener('mousedown', _adjPopoverOutsideHandler, true);
  document.addEventListener('keydown', _adjPopoverEscHandler, true);
}

function openAddSubjectModal(){

    await db.collection('classes').doc(State.classId).collection('subjects').add({
      name: nameIn.value.trim(), teacherUid: State.user.uid, teacherName: State.user.email, txCount:3, createdAt: Date.now()
    });
    if(!(State.klass.gvbmUids||[]).includes(State.user.uid)){
      db.collection('classes').doc(State.classId).update({gvbmUids: firebase.firestore.FieldValue.arrayUnion(State.user.uid)});

async function bulkDeleteStudents(ids){
  if(!ids || !ids.length) return;
  const col = db.collection('classes').doc(State.classId).collection('students');
  let batch = db.batch(); let n=0;
  for(const id of ids){
    batch.delete(col.doc(id)); n++;
    if(n%400===0){ await batch.commit(); batch = db.batch(); }
  }
  if(n%400!==0) await batch.commit();
}

function viewHsGvbm(main, {isGvcn}={}){
  // Lớp GVBM tự tạo để theo dõi riêng, CHƯA có ai nhận làm GVCN
  // (gvcnUid == null): cho phép đúng người đã tạo ra lớp đó tự

    `Lớp ${State.klass.name}` + (isGvcn ? ' — bạn là chủ lớp, có thể tự thêm/sửa học sinh'
      : isOrphanOwner ? ' — lớp riêng của bạn (chưa có GVCN), bạn có thể tự thêm/sửa học sinh'
      : ' — chỉ xem (danh sách do GVCN quản lý)'),

        el('button', {class:'btn btn-ghost btn-sm', onclick: openBulkImportStudentsModal}, '📥 Nhập hàng loạt'),
        el('button', {class:'btn btn-primary btn-sm', onclick: ()=>openStudentModal()}, '+ Thêm học sinh'),
      ] : []),
    ]
  );
  if(!State.students.length){
    main.appendChild(el('div',{class:'empty-state'},
      el('div',{style:'font-size:40px'},'🧑‍🎓'), el('h2',{},'Chưa có học sinh'),
      canManage
        ? el('button',{class:'btn btn-primary', onclick:()=>openStudentModal()},'+ Thêm học sinh đầu tiên')
        : el('p',{class:'muted'},'GVCN chưa thêm danh sách học sinh.')
    ));
    return;
  }
  const selected = new Set();
  let bulkBar = null, selectAllCb = null, tbody = null;
  function refreshBulkBar(){
    if(!bulkBar) return;
    if(!selected.size){ bulkBar.style.display='none'; return; }
    bulkBar.style.display='flex';
    bulkBar.innerHTML='';
    bulkBar.appendChild(el('span',{style:'font-weight:700; font-size:13px'}, `Đã chọn ${selected.size} học sinh`));
    bulkBar.appendChild(el('button',{class:'btn btn-rose btn-sm', onclick: async ()=>{
      if(!confirm(`Xoá vĩnh viễn ${selected.size} học sinh đã chọn? Không thể hoàn tác.`)) return;
      const ids = Array.from(selected);
      await bulkDeleteStudents(ids);
      toast('Đã xoá '+ids.length+' học sinh', 'sage');
    }}, '🗑️ Xoá đã chọn'));
    bulkBar.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:()=>{
      selected.clear();
      tbody.querySelectorAll('input[type=checkbox][data-sid]').forEach(cb=> cb.checked=false);
      if(selectAllCb) selectAllCb.checked=false;
      refreshBulkBar();
    }}, 'Bỏ chọn'));

  if(canManage){
    bulkBar = el('div', {class:'card card-pad', style:'display:none; align-items:center; gap:10px; margin-bottom:12px; background:var(--rose-tint); border-color:var(--rose)'});
    main.appendChild(bulkBar);

  // (gõ "an" vẫn tìm ra "Ân", "Loan"...) nhờ stripDiacritics().

  const wrap = el('div', {class:'card', style:'overflow-x:auto'});

    selectAllCb = el('input',{type:'checkbox'});
    selectAllCb.addEventListener('change', ()=>{
      tbody.querySelectorAll('input[type=checkbox][data-sid]').forEach(cb=>{
        cb.checked = selectAllCb.checked;
        if(selectAllCb.checked) selected.add(cb.dataset.sid); else selected.delete(cb.dataset.sid);
      });
      refreshBulkBar();
    });
    headRow.appendChild(el('th',{style:'width:32px'}, selectAllCb));
  }
  headRow.appendChild(el('th',{},'#')); headRow.appendChild(el('th',{},'Họ tên')); headRow.appendChild(el('th',{},'Ngày sinh')); headRow.appendChild(el('th',{},'Ghi chú'));
  if(canManage) headRow.appendChild(el('th',{},''));
  table.appendChild(el('thead',{}, headRow));
  tbody = el('tbody');
  table.appendChild(tbody); wrap.appendChild(table); main.appendChild(wrap);

  function renderRows(){
    tbody.innerHTML = '';
    const term = stripDiacritics(searchIn.value.trim());
    const list = term ? State.students.filter(s=> stripDiacritics(s.name).includes(term)) : State.students;
    if(!list.length){
      tbody.appendChild(el('tr',{}, el('td',{colspan: canManage?6:4, class:'muted', style:'text-align:center; padding:16px'}, 'Không tìm thấy học sinh nào phù hợp.')));
      return;
    }
    list.forEach(s=>{
      const i = State.students.indexOf(s); // số thứ tự giữ theo danh sách gốc, không đổi theo kết quả lọc

        cb.addEventListener('change', ()=>{ if(cb.checked) selected.add(s.id); else selected.delete(s.id); refreshBulkBar(); });
        tr.appendChild(el('td',{}, cb));
      }
      tr.appendChild(el('td',{},String(i+1)));
      tr.appendChild(el('td',{}, el('strong',{},s.name)));
      tr.appendChild(el('td',{}, fmtDob(s.dob)));
      tr.appendChild(el('td',{class:'muted'}, s.note||''));
      if(canManage){
        tr.appendChild(el('td',{style:'text-align:right; white-space:nowrap'},
          el('button',{class:'icon-btn', onclick:()=>openStudentModal(s)}, '✏️'),
          el('button',{class:'icon-btn', onclick:()=>{ if(confirm('Xoá học sinh '+s.name+'?')) db.collection('classes').doc(State.classId).collection('students').doc(s.id).delete(); }}, '🗑️')
        ));
      }
      tbody.appendChild(tr);
    });
  }
  searchIn.addEventListener('input', renderRows);
  renderRows();
}

function exportSubjectExcel(subj){
  const txCount = subj.txCount||3;
  const header = ['STT','Họ tên', ...Array.from({length:txCount},(_,i)=>'TX'+(i+1)), 'GK','CK','Chuyên cần','Cộng/trừ','TB môn'];
  const rows = [header];
  State.students.forEach((stu,i)=>{
    const gb = State.gradebook[gbKey(subj.id, stu.id)] || {};
    const avg = calcAvg(gb, subj);
    const adjSum = (gb.adj||[]).reduce((a,b)=>a+(b.value||0),0);
    const tx = Array.from({length:txCount},(_,k)=> (gb.tx&&gb.tx[k]!=null)?gb.tx[k]:'');
    rows.push([i+1, stu.name, ...tx, gb.gk??'', gb.ck??'', gb.cc??'', adjSum, avg??'']);
  });
  const wsData = [[`Bảng điểm môn ${subj.name} — Lớp ${State.klass.name}`],[],...rows];
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = [{wch:5},{wch:22},...Array.from({length:txCount},()=>({wch:6})),{wch:6},{wch:6},{wch:9},{wch:9},{wch:8}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, subj.name.slice(0,28));
  XLSX.writeFile(wb, `BangDiem_${subj.name}_${State.klass.name}.xlsx`);
  toast('Đã xuất file Excel','sage');
}

const TKB_DAYS = ['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
function emptyTimetableGrid(){ return Array.from({length:5}, ()=> ({0:'',1:'',2:'',3:'',4:'',5:''})); }
// Mỗi hàng của TKB được lưu dưới dạng OBJECT (map {"0":..,"1":..,...}), KHÔNG dùng mảng-trong-mảng,
// vì Firestore không hỗ trợ lưu "nested array" (mảng chứa mảng) — cố lưu sẽ báo lỗi ngay khi gọi set().
function normalizeTimetableGrid(g){
  if(!Array.isArray(g) || g.length!==5) return emptyTimetableGrid();
  return g.map(row=>{
    const o = {};
    for(let i=0;i<6;i++) o[i] = (row && row[i]) || '';
    return o;
  });
}
// TKB có thể có bản riêng cho từng tuần (VD tuần thi, tuần đổi tiết) — lưu dưới dạng
// map {"YYYY-MM-DD của thứ 2 đầu tuần": {morning, afternoon}} bên trong field timetable,
// nằm chung doc /teachers/{uid} (đã có sẵn quyền đọc/ghi, không cần thêm rule mới).
function normalizeWeeklyGrids(wg){
  const out = {};
  if(wg && typeof wg==='object'){
    Object.keys(wg).forEach(k=>{
      if(/^\d{4}-\d{2}-\d{2}$/.test(k) && wg[k]){
        out[k] = { morning: normalizeTimetableGrid(wg[k].morning), afternoon: normalizeTimetableGrid(wg[k].afternoon) };
      }
    });
  }
  return out;
}
// Các bản TKB đã tải lên/dán (ảnh, PDF, Excel, hoặc dán văn bản) — mỗi bản có tên "TKB số N",
// lưu sẵn lưới đã được AI đọc ra (morning/afternoon) để có thể áp dụng nhanh cho bất kỳ tuần nào.
function normalizeTemplates(tpls){
  const out = {};
  if(tpls && typeof tpls==='object'){
    Object.keys(tpls).forEach(id=>{
      const t = tpls[id];
      if(!t) return;
      out[id] = {
        name: t.name || 'TKB',
        sourceType: t.sourceType || 'khác',
        fileName: t.fileName || '',
        morning: normalizeTimetableGrid(t.morning),
        afternoon: normalizeTimetableGrid(t.afternoon),
        createdAt: t.createdAt || Date.now(),
      };
    });
  }
  return out;
}
// map {"YYYY-MM-DD của thứ 2 đầu tuần": "id bản TKB đang chọn cho tuần đó"}
function normalizeWeekTemplateMap(m){
  const out = {};
  if(m && typeof m==='object'){
    Object.keys(m).forEach(k=>{ if(/^\d{4}-\d{2}-\d{2}$/.test(k) && m[k]) out[k] = String(m[k]); });
  }
  return out;
}

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(String(r.result).split(',')[1]||'');
    r.onerror = ()=> reject(new Error('Không đọc được file này'));
    r.readAsDataURL(file);
  });
}
function buildTkbExtractPrompt(textContext){
  return `Bạn là trợ lý giáo vụ. Dưới đây là ảnh chụp/tệp/văn bản thời khoá biểu (TKB) cá nhân của một giáo viên.${textContext ? '\n\nNội dung trích xuất từ tệp:\n"""\n'+textContext+'\n"""\n' : ''}
Hãy đọc và chuyển thành đúng cấu trúc gồm 2 buổi (sáng, chiều), mỗi buổi TỐI ĐA 5 tiết, mỗi tiết có đúng 6 cột tương ứng Thứ 2 → Thứ 7. Mỗi ô ghi dạng "Lớp - Môn" (VD: "11TIN - Toán") nếu tiết đó có lớp/môn học, để trống "" nếu tiết đó trống/nghỉ/không dạy. Nếu TKB gốc có nhiều hơn 5 tiết một buổi, chỉ lấy 5 tiết đầu của buổi đó.

CHỈ trả lời bằng một JSON object hợp lệ duy nhất, không thêm bất kỳ chữ, lời giải thích hay markdown code fence nào khác, đúng định dạng sau (đúng 5 hàng mỗi buổi, mỗi hàng đúng 6 chuỗi):
{"morning":[["","","","","",""],["","","","","",""],["","","","","",""],["","","","","",""],["","","","","",""]],"afternoon":[["","","","","",""],["","","","","",""],["","","","","",""],["","","","","",""],["","","","","",""]]}`;
}
async function askGeminiForGrid(prompt, inlineData){
  if(!LocalCfg.geminiKey) throw new Error('Cần thêm API key Gemini trong ⚙️ Cài đặt trước');
  if(!(localStorage.getItem('sd_gemini_model')||'').trim()) throw new Error('Chưa chọn được model AI — mở ⚙️ Cài đặt, bấm "Kiểm tra & tự chọn model hoạt động" trước');
  const raw = await callGemini(prompt, inlineData ? {inlineData} : {});
  const cleaned = raw.replace(/```json|```/g,'').trim();
  let data;
  try{ data = JSON.parse(cleaned); }
  catch(e){ throw new Error('AI trả về không đúng định dạng — thử lại (có thể chụp ảnh rõ hơn hoặc đổi model trong Cài đặt).'); }
  return { morning: normalizeTimetableGrid(data.morning), afternoon: normalizeTimetableGrid(data.afternoon) };
}
// Đọc 1 file TKB (ảnh/PDF gửi thẳng cho AI đọc bằng "thị giác"; Excel/văn bản khác trích chữ rồi
// mới gửi cho AI đọc) và trả về lưới đã nhận diện.
async function extractGridFromFile(file){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  if(['png','jpg','jpeg','webp'].includes(ext) || ext==='pdf'){
    const b64 = await fileToBase64(file);
    const mimeType = ext==='pdf' ? 'application/pdf' : (ext==='jpg' ? 'image/jpeg' : 'image/'+ext);
    return await askGeminiForGrid(buildTkbExtractPrompt(''), {mimeType, data: b64});
  }
  if(['xlsx','xls'].includes(ext)){
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const csv = XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]);
    if(!csv.trim()) throw new Error('Không đọc được nội dung từ file Excel này');
    return await askGeminiForGrid(buildTkbExtractPrompt(csv.slice(0,20000)));
  }
  const text = await file.text();
  if(!text.trim()) throw new Error('Không đọc được nội dung từ file này');
  return await askGeminiForGrid(buildTkbExtractPrompt(text.slice(0,20000)));
}
async function extractGridFromPastedText(text){
  return await askGeminiForGrid(buildTkbExtractPrompt(text.slice(0,20000)));
}
function stripDiacritics(s=''){ return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim(); }
function mondayOf(d){
  const dow = (d.getDay()+6)%7;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()-dow, 0,0,0,0);
}
function computeWeekNumber(effectiveDateStr, refDateStr){
  const eff = mondayOf(new Date((effectiveDateStr||todayStr())+'T12:00:00'));
  const ref = mondayOf(new Date((refDateStr||todayStr())+'T12:00:00'));
  const diffDays = Math.round((ref-eff)/86400000);
  return Math.max(1, Math.floor(diffDays/7)+1);
}
function weekRangeLabel(mondayDate){
  const sun = new Date(mondayDate.getFullYear(), mondayDate.getMonth(), mondayDate.getDate()+6);
  return `${fmtDateSlash(mondayDate)} - ${fmtDateSlash(sun)}`;
}

// Ô chọn TUẦN dùng chung, thay cho input type=date đơn lẻ — hiển thị dạng khoảng ngày

// (luôn tự làm tròn về thứ 2 đầu tuần chứa ngày được chọn).
function buildWeekPicker(mondayIso, onChange){
  let monday = mondayOf(new Date((mondayIso||todayStr())+'T12:00:00'));
  const hidden = el('input',{type:'date', style:'position:absolute; opacity:0; width:1px; height:1px; pointer-events:none; left:0; top:100%'});
  const label = el('button',{type:'button', class:'input', style:'width:auto; min-width:178px; text-align:center; cursor:pointer; font-family:var(--font-mono); font-size:13px'}, weekRangeLabel(monday));
  const prevBtn = el('button',{type:'button', class:'btn btn-ghost btn-sm', style:'padding:6px 10px'}, '‹');
  const nextBtn = el('button',{type:'button', class:'btn btn-ghost btn-sm', style:'padding:6px 10px'}, '›');
  function apply(newMonday, fire){
    monday = mondayOf(newMonday);
    label.textContent = weekRangeLabel(monday);
    if(fire && onChange) onChange(isoOfLocalDate(monday));
  }
  prevBtn.addEventListener('click', ()=> apply(new Date(monday.getFullYear(),monday.getMonth(),monday.getDate()-7), true));
  nextBtn.addEventListener('click', ()=> apply(new Date(monday.getFullYear(),monday.getMonth(),monday.getDate()+7), true));
  label.addEventListener('click', ()=>{
    hidden.value = isoOfLocalDate(monday);
    if(hidden.showPicker){ try{ hidden.showPicker(); }catch(e){ hidden.click(); } } else hidden.click();
  });
  hidden.addEventListener('change', ()=>{ if(hidden.value) apply(new Date(hidden.value+'T12:00:00'), true); });
  const box = el('div',{style:'display:inline-flex; align-items:center; gap:4px; position:relative'}, prevBtn, label, nextBtn, hidden);
  box.getMondayIso = ()=> isoOfLocalDate(monday);
  return box;
}
function findTimetableSlots(tt, className, subjectName){
  const nClass = stripDiacritics(className||'');
  const nSubj = stripDiacritics(subjectName||'');
  const slots = [];
  ['morning','afternoon'].forEach(buoi=>{
    tt[buoi].forEach((row, pIdx)=>{
      for(let dIdx=0; dIdx<6; dIdx++){
        const raw = (row[dIdx]||'').trim();
        if(!raw) continue;
        const norm = stripDiacritics(raw);
        if(nClass && !norm.includes(nClass)) continue;
        slots.push({buoi: buoi==='morning'?'sáng':'chiều', period: pIdx+1, dayIdx: dIdx, dayLabel: TKB_DAYS[dIdx], cellText: raw, subjMatch: nSubj ? norm.includes(nSubj) : true});
      }
    });
  });
  // QUAN TRỌNG: phải sắp xếp lại theo đúng thứ tự thời khoá biểu thật (Thứ 2 → Thứ 7, buổi
  // sáng trước buổi chiều, tiết thấp → cao) — vì vòng lặp phía trên duyệt theo TIẾT trước rồi
  // mới đến NGÀY, nên nếu không sắp lại ở đây, thứ tự gửi cho AI sẽ sai (VD tiết ở Thứ 3 bị
  // xếp lên trước tiết ở Thứ 2), khiến AI gán nhầm bài học cho sai tiết/sai thứ.
  const byOrder = (a,b)=> a.dayIdx-b.dayIdx || (a.buoi==='sáng'?0:1)-(b.buoi==='sáng'?0:1) || a.period-b.period;
  slots.sort(byOrder);
  // Ưu tiên ô vừa khớp lớp vừa khớp tên môn; nếu không có ô nào khớp cả hai thì lấy tất cả ô khớp lớp.
  const strict = slots.filter(s=> s.subjMatch);
  return strict.length ? strict : slots;
}

// Bung một bảng HTML (do mammoth chuyển từ .docx) thành lưới ô [hàng][cột], tính đúng luôn cả
// các ô bị GỘP (rowspan/colspan) — VD cột "Ngày tháng" thường chỉ có chữ ở hàng đầu của mỗi
// tuần rồi gộp xuống các hàng dưới — để mọi hàng đều "nhìn thấy" đúng ngày tháng của mình.
function expandHtmlTableToGrid(table){
  const rows = Array.from(table.querySelectorAll('tr'));
  const grid = [];
  const spanCarry = {}; // colIdx -> {remaining, value} (ô đang được gộp xuống từ hàng trên)
  rows.forEach((tr, rIdx)=>{
    grid[rIdx] = [];
    let colIdx = 0;
    const cells = Array.from(tr.children).filter(c=> /^(TD|TH)$/i.test(c.tagName));
    let cellPtr = 0;
    while(cellPtr < cells.length || (spanCarry[colIdx] && spanCarry[colIdx].remaining>0)){
      if(spanCarry[colIdx] && spanCarry[colIdx].remaining>0){
        grid[rIdx][colIdx] = spanCarry[colIdx].value;
        spanCarry[colIdx].remaining--;
        colIdx++;
        continue;
      }
      if(cellPtr>=cells.length) break;
      const cell = cells[cellPtr++];
      const text = (cell.textContent||'').replace(/\s+/g,' ').trim();
      const colspan = Math.max(1, parseInt(cell.getAttribute('colspan')||'1',10)||1);
      const rowspan = Math.max(1, parseInt(cell.getAttribute('rowspan')||'1',10)||1);
      for(let c=0;c<colspan;c++){
        grid[rIdx][colIdx] = text;
        if(rowspan>1) spanCarry[colIdx] = {remaining: rowspan-1, value: text};
        colIdx++;
      }
    }
  });
  return grid;
}
function findPlanColumnIndex(headerRow, keywords){
  for(let i=0;i<headerRow.length;i++){
    const n = stripDiacritics(headerRow[i]||'');
    if(keywords.some(k=> n.includes(k))) return i;
  }
  return -1;
}
// Chỉ trích đúng 3 cột "Ngày tháng", "Tiết thứ", "Tên bài học" từ bảng kế hoạch dạy học — bỏ
// hẳn các cột khác (Yêu cầu cần đạt, Thiết bị dạy học, Ghi chú…) để AI không bị nhiễu bởi nội
// dung thừa không liên quan đến việc khớp bài/tiết.
function extractPlanColumnsFromGrid(grid){
  if(!grid.length) return '';
  const header = grid[0] || [];
  let ngayIdx = findPlanColumnIndex(header, ['ngay']);
  let tietIdx = findPlanColumnIndex(header, ['tiet']);
  let baiIdx = findPlanColumnIndex(header, ['ten bai hoc','bai hoc','ten bai']);
  if(ngayIdx<0) ngayIdx = 0;
  if(tietIdx<0) tietIdx = 1;
  if(baiIdx<0) baiIdx = 2;
  let lastNgay = '';
  const lines = [];
  for(let r=1; r<grid.length; r++){
    const row = grid[r]||[];
    const ngay = (row[ngayIdx]||'').trim();
    const tiet = (row[tietIdx]||'').trim();
    const bai = (row[baiIdx]||'').trim();
    if(ngay) lastNgay = ngay;
    if(!bai) continue; // bỏ hàng trống / hàng tiêu đề phụ không có tên bài học
    lines.push(`Tuần ${lastNgay || '(?)'} — Tiết ${tiet || '?'}: ${bai}`);
  }
  return lines.join('\n');
}
async function extractPlanTextFromFile(file){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  if(ext==='docx'){
    const buf = await file.arrayBuffer();
    // Ưu tiên đọc bảng đúng cấu trúc (chỉ lấy 3 cột cần thiết); nếu file không có bảng hoặc
    // đọc bảng lỗi, mới dự phòng lấy toàn bộ văn bản thô như trước (đỡ hơn là mất trắng).
    try{
      const htmlRes = await mammoth.convertToHtml({arrayBuffer: buf});
      const htmlDoc = new DOMParser().parseFromString(htmlRes.value||'', 'text/html');
      const tables = Array.from(htmlDoc.querySelectorAll('table'));
      if(tables.length){
        const parts = tables.map(t=> extractPlanColumnsFromGrid(expandHtmlTableToGrid(t))).filter(Boolean);
        const joined = parts.join('\n');
        if(joined.trim()) return joined.trim();
      }
    }catch(e){ /* rơi xuống đọc văn bản thô ở dưới nếu đọc bảng lỗi */ }
    const res = await mammoth.extractRawText({arrayBuffer: buf});
    return (res.value||'').trim();
  }
  // txt hoặc các định dạng văn bản thuần khác — đọc trực tiếp
  return await file.text();
}

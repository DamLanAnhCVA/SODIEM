<style>
:root{
  --paper:#FBF9F4;
  --paper-dark:#F1ECDE;
  --ink:#2B2B2E;
  --ink-soft:#6b6862;
  --red:#C1272D;
  --red-dark:#8f1c21;
  --red-bg:#FCEAEA;
  --green:#2F5233;
  --green-bg:#EAF0E7;
  --line:#DCD5C2;
  --gold:#B4842A;
  --gold-bg:#FAF1DD;
  --radius:10px;
  --shadow:0 1px 2px rgba(43,43,46,.06), 0 6px 20px -8px rgba(43,43,46,.15);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Be Vietnam Pro',sans-serif;
  font-size:14.5px;
  line-height:1.5;
  background-image:
    repeating-linear-gradient(to bottom, transparent 0 31px, rgba(180,150,90,.10) 31px 32px);
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Literata',serif;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:var(--red-dark);}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--gold-bg);}

.app-shell{max-width:1180px;margin:0 auto;padding:0 20px 60px;}
.margin-rule{position:fixed;top:0;bottom:0;left:calc(50% - 590px + 64px);width:1px;background:rgba(193,39,45,.28);z-index:0;pointer-events:none;}
@media(max-width:1220px){.margin-rule{display:none;}}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px;border-bottom:1.5px solid var(--line);
  max-width:1180px;margin:0 auto;position:relative;z-index:1;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Literata',serif;font-weight:700;font-size:17px;transform:rotate(-4deg);box-shadow:var(--shadow);}
.brand-text .t1{font-family:'Literata',serif;font-weight:600;font-size:18px;letter-spacing:.2px;}
.brand-text .t2{font-size:11.5px;color:var(--ink-soft);margin-top:-2px;}

.tabs{display:flex;gap:4px;}
.tab-btn{padding:8px 14px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink-soft);font-weight:600;font-size:13.5px;}

<body>
<div class="margin-rule"></div>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js" defer></script>
<script>
if(window['pdfjsLib']){ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }

/* ============================= UTILITIES ============================= */
const $ = s=>document.querySelector(s);
const app = $('#app');
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc = s => (s??'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtDate = ts => new Date(ts).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'});
function toast(msg, type='', opts={}){
  const el=document.createElement('div');
  el.className='toast'+(type?' '+type:'');
  const title = opts.title || (type==='err' ? 'Có lỗi xảy ra' : (type==='ok' ? 'Xong' : ''));
  el.innerHTML = (title?`<span class="toast-title">${esc(title)}</span>`:'') + esc(msg);
  if(opts.actionLabel && opts.onAction){
    const b=document.createElement('button');
    b.className='toast-action'; b.textContent=opts.actionLabel;
    b.onclick = ()=>{ opts.onAction(); el.remove(); };
    el.appendChild(b);
  }
  $('#toastWrap').appendChild(el);
  setTimeout(()=>el.remove(), opts.duration || 6000);
}
// Turn a raw API/error message into a short, friendly Vietnamese summary.
function friendlyApiError(raw){
  const s = (raw||'').toString();
  if(/quota|RESOURCE_EXHAUSTED|429/i.test(s)){
    return {
      msg:'Tài khoản Gemini đã hết hạn mức (quota) dùng thử cho model này trong hôm nay/phút này. Hãy thử lại sau ít phút, hoặc đổi sang model "flash" (hạn mức miễn phí cao hơn) trong mục Cài đặt.',
      title:'Hết hạn mức Gemini API'
    };
  }
  if(/API key not valid|API_KEY_INVALID|400/i.test(s) && /key/i.test(s)){
    return {msg:'API key không hợp lệ. Vào Cài đặt, kiểm tra lại và dán đúng khoá Gemini API key.', title:'Sai API key'};
  }
  if(/SAFETY|blocked/i.test(s)){
    return {msg:'Gemini từ chối trả lời nội dung này (bộ lọc an toàn). Hãy thử lại hoặc kiểm tra ảnh/đề bài.', title:'Bị chặn bởi bộ lọc an toàn'};
  }
  if(/Failed to fetch|NetworkError/i.test(s)){
    return {msg:'Không kết nối được tới máy chủ Gemini. Kiểm tra lại kết nối mạng.', title:'Lỗi kết nối'};
  }
  // fallback: shorten very long raw errors
  const short = s.length>220 ? s.slice(0,220)+'…' : s;
  return {msg:short, title:'Lỗi'};
}
function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}
/* ============ XỬ LÝ CHIỀU ẢNH (orientation) ============
   Ảnh chụp từ điện thoại thường kèm cờ EXIF orientation. Trình duyệt tự xoay đúng khi
   hiển thị <img>, nhưng jsPDF (khi xuất PDF) lại BỎ QUA cờ này -> ảnh trong PDF bị nằm
   ngang/ngược. Cách xử lý: vẽ lại ảnh qua <canvas> để "nướng" đúng chiều mà trình duyệt
   hiển thị vào chính pixel (đồng thời gỡ EXIF), nhờ đó PDF cũng nhận đúng chiều. */
function _exifOrientation(buf){            // đọc cờ EXIF (1..8), mặc định 1
  try{
    const v=new DataView(buf);
    if(v.getUint16(0,false)!==0xFFD8) return 1;   // không phải JPEG
    const len=v.byteLength; let off=2;
    while(off+4<=len){
      const marker=v.getUint16(off,false); off+=2;
      if(marker===0xFFE1){                          // APP1 (Exif)
        if(v.getUint32(off+2,false)!==0x45786966) return 1;   // "Exif"
        const tiff=off+8;
        const little=v.getUint16(tiff,false)===0x4949;
        const ifd=tiff+v.getUint32(tiff+4,little);
        const n=v.getUint16(ifd,little);
        for(let i=0;i<n;i++){ const e=ifd+2+i*12; if(v.getUint16(e,little)===0x0112) return v.getUint16(e+8,little)||1; }
        return 1;
      } else if((marker&0xFF00)!==0xFF00){ break; }
      else { off += v.getUint16(off,false); }
    }
  }catch(_){}
  return 1;
}
function _dataURLBytes(u){
  try{ const b=atob((u.split(',')[1]||'')); const a=new Uint8Array(b.length); for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i); return a.buffer; }
  catch(_){ return new ArrayBuffer(0); }
}
// Vẽ lại ảnh qua canvas -> "nướng" đúng chiều hiển thị. Không bao giờ xoay lố.
function _bakeImage(src){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{ try{
      const w=im.naturalWidth||im.width, h=im.naturalHeight||im.height;
      if(!w||!h){ res(src); return; }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(im,0,0,w,h);
      res(c.toDataURL('image/jpeg',0.92));
    }catch(_){ res(src); } };
    im.onerror=()=>res(src);
    im.src=src;
  });
}
// File -> dataURL đã dựng thẳng (chỉ nướng lại khi ảnh JPEG có EXIF ≠ 1, để giữ chất lượng ảnh vốn đã đúng).
async function normalizeImageFile(file){
  const isJpeg = /jpe?g/i.test(file.type||'') || /\.jpe?g$/i.test(file.name||'');
  if(isJpeg){
    let ori=1; try{ ori=_exifOrientation(await file.arrayBuffer()); }catch(_){}
    if(ori<=1) return await fileToDataURL(file);
    const url=URL.createObjectURL(file);
    try{ return await _bakeImage(url); }
    finally{ try{URL.revokeObjectURL(url);}catch(_){} }
  }
  return await fileToDataURL(file);
}
// Xoay 1 ảnh (dataURL) 90° theo chiều kim đồng hồ, trả dataURL mới (null nếu lỗi).
function rotate90(src){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{ try{
      const w=im.naturalWidth||im.width, h=im.naturalHeight||im.height;
      const c=document.createElement('canvas'); c.width=h; c.height=w;
      const ctx=c.getContext('2d'); ctx.translate(h,0); ctx.rotate(Math.PI/2); ctx.drawImage(im,0,0,w,h);
      res(c.toDataURL('image/jpeg',0.92));
    }catch(_){ res(null); } };
    im.onerror=()=>res(null);
    im.src=src;
  });
}
// Di trú: dựng thẳng các trang ảnh cũ đã lưu bị xoay (chỉ chạy 1 lần cho mỗi bài, idempotent).
async function fixPageOrientation(sub){
  if(!sub || sub._orientFixed) return;
  if((sub.images||[]).length){
    let changed=false;
    for(let i=0;i<sub.images.length;i++){
      const u=sub.images[i]; if(typeof u!=='string') continue;
      let ori=1; try{ ori=_exifOrientation(_dataURLBytes(u)); }catch(_){}
      if(ori>1){ try{ const b=await _bakeImage(u); if(b&&b!==u){ sub.images[i]=b; changed=true; } }catch(_){} }
    }
    sub._orientFixed=true;
    if(changed){ try{ await idbPut('submissions', sub); }catch(_){} }
  } else { sub._orientFixed=true; }
}
async function pdfFileToImages(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  const out=[];
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({scale:1.8});
    const canvas=document.createElement('canvas');
    canvas.width=viewport.width; canvas.height=viewport.height;
    await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
    out.push(canvas.toDataURL('image/jpeg',0.92));
  }
  return out;
}
/* ---- Nạp thư viện đọc Word khi cần (mammoth = đọc .docx, html2canvas = vẽ ra ảnh) ---- */
function loadScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[src="${src}"]`)){ res(); return; }
    const s=document.createElement('script'); s.src=src;
    s.onload=()=>res(); s.onerror=()=>rej(new Error('Không tải được '+src));
    document.head.appendChild(s);
  });
}
let _docxLibsPromise=null;
function ensureDocxLibs(){
  if(!_docxLibsPromise){
    _docxLibsPromise = Promise.all([
      loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.9.0/mammoth.browser.min.js'),
      loadScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js')
    ]).catch(e=>{ _docxLibsPromise=null; throw e; });
  }
  return _docxLibsPromise;
}
/* ---- Nạp thư viện tạo PDF (jsPDF) chắc chắn ngay khi cần xuất ----
   Thẻ <script> nạp sẵn ở đầu trang có thể tải lỗi (mất mạng, hoặc mạng
   trường/công ty chặn cdnjs). Ở đây ta kiểm tra lại khi bấm Xuất PDF: nếu
   thư viện chưa sẵn sàng thì thử CDN chính, rồi thử CDN dự phòng (jsdelivr,
   cùng nguồn với thư viện đọc Word ở trên). Trả về hàm dựng jsPDF. */
let _pdfLibPromise=null;
function ensurePdfLib(){
  const has = ()=> !!(window.jspdf && window.jspdf.jsPDF);
  if(has()) return Promise.resolve(window.jspdf.jsPDF);
  if(!_pdfLibPromise){
    const SRC1='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    const SRC2='https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
    _pdfLibPromise = loadScript(SRC1).catch(()=>{})
      .then(()=> has() ? null : loadScript(SRC2).catch(()=>{}))
      .then(()=>{
        if(!has()) throw new Error('Không tải được thư viện tạo PDF. Hãy kiểm tra kết nối mạng rồi thử lại; nếu mạng chặn cdnjs/jsdelivr thì thử mạng khác.');
        return window.jspdf.jsPDF;
      })
      .catch(e=>{ _pdfLibPromise=null; throw e; });
  }
  return _pdfLibPromise;
}
/* Chuyển 1 file Word (.docx) thành các trang ảnh (giữ định dạng, in được, khoanh lỗi được) */
async function docxFileToImages(file){
  await ensureDocxLibs();
  if(typeof mammoth==='undefined' || typeof html2canvas==='undefined') throw new Error('lib-not-loaded');
  const arrayBuffer = await file.arrayBuffer();
  const result = await mammoth.convertToHtml({arrayBuffer});
  const bodyHTML = (result && result.value && result.value.trim()) ? result.value : '<p>(Tài liệu trống)</p>';

  const SCALE=2, PAGE_W=794, PAGE_H=Math.round(PAGE_W*297/210);
  const holder=document.createElement('div');
  holder.style.cssText='position:fixed;left:-99999px;top:0;width:'+PAGE_W+'px;background:#ffffff;padding:56px 64px;box-sizing:border-box;font-family:\'Be Vietnam Pro\',Arial,sans-serif;font-size:16px;line-height:1.65;color:#111;';
  holder.innerHTML='<style>.dxw h1{font-size:22px;margin:0 0 12px;font-weight:700;}.dxw h2{font-size:18px;margin:16px 0 8px;font-weight:700;}.dxw h3{font-size:16px;margin:14px 0 6px;font-weight:700;}.dxw p{margin:0 0 10px;}.dxw ul,.dxw ol{margin:0 0 10px 22px;}.dxw li{margin:0 0 4px;}.dxw table{border-collapse:collapse;width:100%;margin:0 0 10px;}.dxw td,.dxw th{border:1px solid #999;padding:4px 6px;font-size:14px;}.dxw img{max-width:100%;height:auto;}</style><div class="dxw">'+bodyHTML+'</div>';
  document.body.appendChild(holder);
  try{
    if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(_){}} 
    await Promise.all(Array.from(holder.querySelectorAll('img')).map(img=>(img.complete&&img.naturalWidth)?Promise.resolve():new Promise(r=>{img.onload=img.onerror=r;})));
    const full = await html2canvas(holder,{scale:SCALE,backgroundColor:'#ffffff',useCORS:true,logging:false});
    const pageHpx=PAGE_H*SCALE, out=[]; let y=0;
    while(y < full.height-2){
      let h=Math.min(pageHpx, full.height-y);
      if(y+h < full.height){ // tìm dòng trắng để không cắt ngang chữ
        const ctx0=full.getContext('2d'); let bestCut=h; const scanFrom=Math.max(10,h-90);
        for(let yy=h; yy>=scanFrom; yy--){
          const row=ctx0.getImageData(0,y+yy,full.width,1).data; let dark=0;
          for(let px=0; px<row.length; px+=16){ if(row[px]<235||row[px+1]<235||row[px+2]<235){ dark++; if(dark>2) break; } }
          if(dark<=2){ bestCut=yy; break; }
        }
        h=bestCut;
      }
      const c=document.createElement('canvas'); c.width=full.width; c.height=h;
      c.getContext('2d').drawImage(full,0,y,full.width,h,0,0,full.width,h);
      out.push(c.toDataURL('image/jpeg',0.92)); y+=h;
    }
    return out;
  } finally { document.body.removeChild(holder); }
}
async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function imgDims(dataURL){
  return new Promise(res=>{ const i=new Image(); i.onload=()=>res({w:i.width,h:i.height}); i.src=dataURL; });
}

/* ============================= IndexedDB layer ============================= */
const DB_NAME='cham_bai_ai_db', DB_VER=1;
let _db;
function openDB(){
  return new Promise((res,rej)=>{
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e=>{
      const db=e.target.result;
      ['meta','classes','assignments','submissions'].forEach(store=>{
        if(!db.objectStoreNames.contains(store)) db.createObjectStore(store,{keyPath:'id'});
      });
    };
    req.onsuccess = e=>{_db=e.target.result; res(_db);};
    req.onerror = e=>rej(e);
  });
}
function idbAll(store){
  return new Promise((res,rej)=>{
    const tx=_db.transaction(store,'readonly'); const st=tx.objectStore(store);
    const req=st.getAll(); req.onsuccess=()=>res(req.result||[]); req.onerror=rej;
  });
}
function idbPut(store,obj){
  return new Promise((res,rej)=>{
    const tx=_db.transaction(store,'readwrite'); tx.objectStore(store).put(obj);
    tx.oncomplete=()=>res(obj); tx.onerror=rej;
  });
}
function idbDelete(store,id){
  return new Promise((res,rej)=>{
    const tx=_db.transaction(store,'readwrite'); tx.objectStore(store).delete(id);
    tx.oncomplete=()=>res(); tx.onerror=rej;
  });
}
function idbClear(store){
  return new Promise((res,rej)=>{
    const tx=_db.transaction(store,'readwrite'); tx.objectStore(store).clear();
    tx.oncomplete=()=>res(); tx.onerror=rej;
  });
}

async function autoCleanup(){
  const days = (state.meta && typeof state.meta.retentionDays==='number') ? state.meta.retentionDays : 7;
  if(!days || days<=0) return 0;                       // 0 = không tự xoá bài nào
  const now=Date.now(); const ms=days*24*3600*1000;
  const stale = state.submissions.filter(s=>s.gradedAt && (now - s.gradedAt) > ms);
  for(const s of stale){ await idbDelete('submissions', s.id); }
  if(stale.length){ state.submissions = state.submissions.filter(s=>!(s.gradedAt && (now-s.gradedAt)>ms)); }
  return stale.length;
}

/* ============================= GEMINI API ============================= */
function apiBase(model){ return `https://generativelanguage.googleapis.com/v1beta/models/${model}`; }

// Ước lượng "độ mạnh" của model để ưu tiên thử trước: bản mới hơn / "pro" > "flash" > "flash-lite",
// loại các model không phù hợp (embedding, tts, tạo ảnh, âm thanh...).
function modelScore(id){
  if(/embedding|aqa|tts|image-generation|native-audio|live-|vision-only/i.test(id)) return -9999;
  let s=0;
  const v = id.match(/(\d+)\.(\d+)/);
  if(v) s += (parseInt(v[1])*10 + parseInt(v[2]))*10;
  if(/-pro|pro-latest/i.test(id)) s+=500;
  else if(/-flash-lite/i.test(id)) s+=80;
  else if(/-flash|flash-latest/i.test(id)) s+=250;
  if(/latest/i.test(id)) s+=5;
  if(/exp|preview|thinking/i.test(id)) s-=60;
  return s;
}

async function geminiListModels(apiKey){
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(apiKey)}`);
  if(!res.ok) throw new Error('Không kết nối được tới Gemini API. Kiểm tra lại API key.');
  const data = await res.json();
  const models = (data.models||[]).filter(m=>
    (m.supportedGenerationMethods||[]).includes('generateContent') &&
    /gemini/i.test(m.name) && !/embedding|aqa|vision-only/i.test(m.name)
  );
  return models.map(m=>({
    id: m.name.replace('models/',''),
    display: m.displayName || m.name,
    desc: m.description||'',
    testStatus:'pending'
  })).filter(m=>modelScore(m.id) > -9999).sort((a,b)=> modelScore(b.id)-modelScore(a.id));
}

// Gửi một yêu cầu rất nhỏ tới model để kiểm tra xem model đó có thực sự chấm/giải được không
// (còn hạn mức, có quyền truy cập...) chứ không chỉ có tên trong danh sách.
async function probeModel(apiKey, modelId){
  try{
    const res = await fetch(`${apiBase(modelId)}:generateContent?key=${encodeURIComponent(apiKey)}`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({contents:[{role:'user',parts:[{text:'Trả lời đúng một chữ: OK'}]}], generationConfig:{temperature:0,maxOutputTokens:8}})
    });
    if(res.ok){
      const data = await res.json();
      if(data.candidates?.length) return {ok:true};
      return {ok:false, reasonShort:'Không có phản hồi'};
    }
    let msg=''; try{ const e=await res.json(); msg=e.error?.message||''; }catch(e){}
    let reasonShort='Lỗi '+res.status;
    if(res.status===429||/quota/i.test(msg)) reasonShort='Hết hạn mức';
    else if(res.status===403) reasonShort='Không có quyền';
    else if(res.status===404) reasonShort='Không tồn tại';
    return {ok:false, reasonShort, status:res.status};
  }catch(e){ return {ok:false, reasonShort:'Lỗi kết nối'}; }
}

// Danh sách model dự phòng theo thứ tự ưu tiên, dùng khi model đang chọn gặp lỗi giữa lúc chấm bài.
function candidateModelChain(preferred){
  const fromList = (state.ui.modelList||[]).slice().sort((a,b)=>modelScore(b.id)-modelScore(a.id)).map(m=>m.id);
  const fallbackDefaults = ['gemini-2.5-flash','gemini-2.0-flash','gemini-flash-latest','gemini-1.5-flash','gemini-2.5-pro','gemini-1.5-pro'];
  const chain=[];
  if(preferred) chain.push(preferred);
  fromList.forEach(id=>{ if(!chain.includes(id)) chain.push(id); });
  fallbackDefaults.forEach(id=>{ if(!chain.includes(id)) chain.push(id); });
  return chain;
}

async function callGenerateOnce(apiKey, useModel, parts, json, temperature, _retry=0){
  const body = { contents:[{role:'user', parts}], generationConfig:{ temperature, ...(json?{responseMimeType:'application/json'}:{}) } };
  const res = await fetch(`${apiBase(useModel)}:generateContent?key=${encodeURIComponent(apiKey)}`,{
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
  });
  if(!res.ok){
    let msg='Gemini API lỗi.'; const status=res.status;
    try{ const e=await res.json(); msg = e.error?.message || msg; }catch(e){}
    if((status===429 || status===503) && _retry<1){
      await new Promise(r=>setTimeout(r, 2500));
      return callGenerateOnce(apiKey, useModel, parts, json, temperature, _retry+1);
    }
    const err = new Error(msg); err.status=status; throw err;
  }
  const data = await res.json();
  const cand = data.candidates?.[0];
  if(!cand){ const err=new Error('Gemini không trả về kết quả (có thể do bộ lọc an toàn).'); err.status=200; throw err; }
  return (cand.content?.parts||[]).map(p=>p.text||'').join('');
}

// Tự động thử lần lượt các model theo thứ tự ưu tiên; nếu model đang chọn hết hạn mức / không có quyền,
// tự chuyển sang model kế tiếp còn dùng được và LƯU LUÔN model đó làm mặc định — giáo viên không cần tự tìm.
async function geminiGenerate(parts, {json=false, temperature=0.15, model}={}){
  const apiKey = state.meta.gemini.apiKey;
  if(!apiKey) throw new Error('Chưa nhập Gemini API key trong Cài đặt.');
  if(!state.ui.modelList.length){
    try{ state.ui.modelList = await geminiListModels(apiKey); }catch(e){ /* dùng danh sách dự phòng mặc định */ }
  }
  const preferred = model || state.meta.gemini.model;
  const chain = candidateModelChain(preferred);
  let lastErr;
  for(const useModel of chain){
    try{
      const text = await callGenerateOnce(apiKey, useModel, parts, json, temperature);
      if(useModel !== state.meta.gemini.model){
        state.meta.gemini.model = useModel;
        await saveMeta();
        toast(`Model trước đó gặp lỗi, đã tự động chuyển sang "${useModel}" và lưu làm mặc định — bạn không cần tự tìm model nữa.`, 'ok', {title:'Tự động chuyển model', duration:7000});
      }
      return text;
    }catch(err){
      lastErr = err;
      if(![429,403,404,503].includes(err.status)) throw err; // lỗi khác (vd. yêu cầu sai) thì dừng ngay, không thử tiếp
    }
  }
  throw lastErr || new Error('Không có model nào khả dụng.');
}

function dataURLtoInline(dataURL){
  const [head,b64] = dataURL.split(',');
  const mime = /data:(.*?);base64/.exec(head)?.[1] || 'image/jpeg';

}

function parseGradeJSON(text){
  let clean = text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  let parsed;
  try{ parsed = JSON.parse(clean); }
  catch(e){
    const m = clean.match(/\{[\s\S]*\}/);
    if(m){ parsed = JSON.parse(m[0]); } else throw new Error('Không đọc được kết quả JSON từ AI.');
  }
  parsed.loi = (parsed.loi||[]).map(l=>({
    id: uid(), trang: Number(l.trang)||1,
    x:clamp01(l.x), y:clamp01(l.y), w:clamp01(l.w), h:clamp01(l.h),
    loai_loi: l.loai_loi||'Lỗi', mo_ta: l.mo_ta||'', cach_khac_phuc: l.cach_khac_phuc||''
  }));
  parsed.diem_de_xuat = parsed.diem_de_xuat ?? null;
  parsed.nhan_xet_chung = parsed.nhan_xet_chung || '';
  parsed.dinh_huong_tiep_theo = parsed.dinh_huong_tiep_theo || '';
  return parsed;
}
function clamp01(v){ v=Number(v); if(isNaN(v))return 0; return Math.max(0,Math.min(1,v)); }

/* ============================= VIEW: LOGIN / SETUP PASSWORD ============================= */
function renderLogin(){
  const hasPass = !!state.meta.passHash;
  app.innerHTML = `
  <div class="login-wrap">
    <div class="card login-card">
      <div class="brand" style="margin-bottom:18px;">
        <div class="brand-mark">C</div>
        <div class="brand-text"><div class="t1">Chấm Bài AI</div><div class="t2">Sổ chấm bài giáo viên</div></div>
      </div>
      ${hasPass ? `
        <div class="eyebrow">Đăng nhập</div>
        <h2 class="section-title" style="font-size:19px;">Nhập mật khẩu giáo viên</h2>
        <div class="field" style="margin-top:16px;">
          <input type="password" id="loginPass" placeholder="Mật khẩu" autofocus>
        </div>
        <button class="btn btn-red" style="width:100%;justify-content:center;" data-act="doLogin">Vào sổ chấm bài</button>
        <div id="loginErr" class="field-hint" style="color:var(--red);margin-top:10px;"></div>
      ` : `
        <div class="eyebrow">Thiết lập lần đầu</div>
        <h2 class="section-title" style="font-size:19px;">Đặt mật khẩu truy cập</h2>
        <p class="section-sub">Chỉ giáo viên biết mật khẩu này mới xem được sổ chấm bài trên thiết bị này.</p>
        <div class="field"><label class="field-label">Mật khẩu mới</label><input type="password" id="newPass1"></div>
        <div class="field"><label class="field-label">Nhập lại mật khẩu</label><input type="password" id="newPass2"></div>
        <button class="btn btn-red" style="width:100%;justify-content:center;" data-act="doSetPass">Tạo mật khẩu &amp; bắt đầu</button>
        <div id="loginErr" class="field-hint" style="color:var(--red);margin-top:10px;"></div>
      `}
    </div>
    <div class="login-footer">Sản phẩm được phát triển bởi cô giáo <b>Đàm Thị Lan Anh</b> - Trường THPT chuyên Chu Văn An, Hà Nội.<br>Góp ý xin liên hệ <b>0979.354.002</b>.</div>
  </div>`;
  const passInput = $('#loginPass') || $('#newPass2');
  if(passInput) passInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ hasPass? doLogin() : doSetPass(); } });
}
async function doSetPass(){
  const p1=$('#newPass1').value, p2=$('#newPass2').value;
  if(p1.length<4){ $('#loginErr').textContent='Mật khẩu cần ít nhất 4 ký tự.'; return; }
  if(p1!==p2){ $('#loginErr').textContent='Hai mật khẩu không khớp.'; return; }
  state.meta.passHash = await sha256(p1);
  state.meta.id='meta';
  await saveMeta();
  state.authed=true; state.cur.tab='classes';
  render();
}
async function doLogin(){
  const p = $('#loginPass').value;
  const h = await sha256(p);
  if(h===state.meta.passHash){ state.authed=true; state.cur.tab='classes'; render(); }
  else { $('#loginErr').textContent='Sai mật khẩu, vui lòng thử lại.'; }
}

function renderModelList(){
  const wrap = $('#modelListWrap'); if(!wrap) return;
  const cur = state.meta.gemini.model;
  if(!state.ui.modelList.length){ wrap.innerHTML=''; return; }
  const statusHTML = m=>{
    if(m.testStatus==='testing') return `<span class="spinner" style="border-color:rgba(180,132,42,.3);border-top-color:var(--gold);"></span> <span style="color:var(--ink-soft);font-size:11.5px;">đang thử...</span>`;
    if(m.testStatus==='ok') return `<span class="badge badge-done">✓ Chấm được</span>`;
    if(m.testStatus==='fail') return `<span class="badge" style="background:var(--red-bg);color:var(--red-dark);">✗ ${esc(m.failReason||'Lỗi')}</span>`;
    return `<span class="badge badge-none">Chưa kiểm tra</span>`;
  };
  wrap.innerHTML = `<div class="field-label" style="margin-bottom:8px;">Model đang dùng để chấm bài (đã tự động chọn model đầu tiên chấm được; có thể chọn tay model khác nếu muốn):</div>` +
    state.ui.modelList.map(m=>`
      <label class="model-chip" style="cursor:pointer;">
        <span><input type="radio" name="modelPick" value="${esc(m.id)}" ${m.id===cur?'checked':''}> <b>${esc(m.display)}</b> <span class="mono" style="color:var(--ink-soft);">(${esc(m.id)})</span></span>
        ${statusHTML(m)}
      </label>`).join('');
}

/* Renders the content of #asgAiAnswer into #asgAiAnswerPreview with math
   ($$...$$ / $...$ / \(...\) / \[...\]) typeset properly via KaTeX, so the
   teacher can check formulas like \begin{cases}...\end{cases} or
   \begin{aligned}...\end{aligned} instead of raw LaTeX source. */
function renderAsgAiAnswerPreview(){
  const ta = $('#asgAiAnswer'); const box = $('#asgAiAnswerPreview');
  if(!ta || !box) return;
  const raw = ta.value || '';
  if(!raw.trim()){
    box.innerHTML = '<div class="mp-empty">Chưa có nội dung để xem trước.</div>';
    return;
  }
  // Quan trọng: đặt TOÀN BỘ nội dung vào MỘT text node duy nhất (không tách
  // theo từng dòng thành nhiều thẻ <p>). KaTeX auto-render chỉ tìm cặp
  // delimiter $$...$$ trong CÙNG một text node/phần tử — nếu công thức
  // \begin{aligned}...\end{aligned} trải dài nhiều dòng mà mỗi dòng nằm
  // trong một thẻ <p> riêng thì dấu $$ mở và đóng sẽ ở hai phần tử khác
  // nhau nên không bao giờ khớp được, khiến công thức nhiều dòng bị lỗi
  // không hiển thị (dù công thức 1 dòng vẫn hiển thị đúng). Dùng
  // white-space:pre-wrap (CSS) để vẫn giữ xuống dòng mà không cần chia nhỏ.
  box.textContent = raw;
  if(window.renderMathInElement){
    try{
      renderMathInElement(box, {
        delimiters: [
          {left:'$$', right:'$$', display:true},
          {left:'\\[', right:'\\]', display:true},
          {left:'\\(', right:'\\)', display:false},
          {left:'$', right:'$', display:false}
        ],
        throwOnError:false
      });
    }catch(err){ /* leave raw text visible if a formula fails to parse */ }
  }
}

async function drawPageStage(){
  const sub = state.submissions.find(s=>s.id===state.cur.submissionId);
  const page = state.ui.reviewPage;
  const src = sub.images[page];
  const res = sub.result || {loi:[]};
  const stage = $('#pageStage');
  stage.innerHTML = `<img id="stageImg" src="${src}"><svg id="stageSvg"></svg>`;
  const img = $('#stageImg');
  const draw = ()=>{
    const w = img.clientWidth, h = img.clientHeight;
    const svg = $('#stageSvg');
    let boxesHTML='';
    let svgArrows='';
    res.loi.forEach((e,i)=>{
      if(((e.trang||1)-1)!==page) return;
      const bx=e.x*w, by=e.y*h, bw=e.w*w, bh=e.h*h;
      const bdX = bx+bw, bdY = by;
      boxesHTML += `<div class="errbox" style="left:${bx}px;top:${by}px;width:${bw}px;height:${bh}px;" data-act="selectErr" data-i="${i}"></div>
        <div class="errbadge" style="left:${bdX}px;top:${bdY}px;" data-act="selectErr" data-i="${i}">${i+1}</div>`;
      svgArrows += `<line x1="${bdX}" y1="${bdY}" x2="${bdX+18}" y2="${bdY-14}" stroke="#C1272D" stroke-width="1.5" />`;
    });
    stage.querySelectorAll('.errbox,.errbadge').forEach(n=>n.remove());
    stage.insertAdjacentHTML('beforeend', boxesHTML);
    svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
    svg.innerHTML = svgArrows;
  };
  if(img.complete) draw(); else img.onload=draw;
  window.addEventListener('resize', draw, {once:true});

  // Kéo để thêm lỗi — dùng Pointer Events nên chạy được cả CHUỘT và CẢM ỨNG (điện thoại)
  let dragStart=null, tempBox=null, activePointer=null;
  function ptPos(e){
    const r = stage.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(r.width,  e.clientX - r.left)),
      y: Math.max(0, Math.min(r.height, e.clientY - r.top))
    };
  }
  function cleanupTemp(){
    if(tempBox){ tempBox.remove(); tempBox=null; }
    dragStart=null;
    if(activePointer!=null){ try{ stage.releasePointerCapture(activePointer); }catch(_){}
      activePointer=null; }
  }
  stage.addEventListener('pointerdown', e=>{
    if(!state.ui.drawing) return;
    e.preventDefault();
    activePointer = e.pointerId;
    try{ stage.setPointerCapture(e.pointerId); }catch(_){}
    const p = ptPos(e);
    dragStart = {x:p.x, y:p.y};
    tempBox = document.createElement('div');
    tempBox.className='errbox'; tempBox.style.borderStyle='dashed';
    tempBox.style.left=p.x+'px'; tempBox.style.top=p.y+'px'; tempBox.style.width='0px'; tempBox.style.height='0px';
    stage.appendChild(tempBox);
  });
  stage.addEventListener('pointermove', e=>{
    if(dragStart==null || e.pointerId!==activePointer) return;
    e.preventDefault();
    const p = ptPos(e);
    const x=Math.min(dragStart.x,p.x), y=Math.min(dragStart.y,p.y);
    const w2=Math.abs(p.x-dragStart.x), h2=Math.abs(p.y-dragStart.y);
    tempBox.style.left=x+'px'; tempBox.style.top=y+'px'; tempBox.style.width=w2+'px'; tempBox.style.height=h2+'px';
  });
  stage.addEventListener('pointerup', e=>{
    if(dragStart==null || e.pointerId!==activePointer) return;
    e.preventDefault();
    const p = ptPos(e);
    const w = img.clientWidth, h = img.clientHeight;
    const x=Math.min(dragStart.x,p.x)/w, y=Math.min(dragStart.y,p.y)/h;
    const w2=Math.abs(p.x-dragStart.x)/w, h2=Math.abs(p.y-dragStart.y)/h;
    cleanupTemp();
    if(w2<0.008||h2<0.008){ return; } // quá nhỏ (chạm nhầm) → giữ nguyên chế độ để thử lại
    state.ui.drawing=false; stage.style.touchAction='';
    const btn=$('#addErrBtn'); if(btn){ btn.classList.remove('btn-green'); btn.textContent='+ Thêm lỗi trên trang này'; }
    const sub2 = state.submissions.find(s=>s.id===state.cur.submissionId);
    if(!sub2.result) sub2.result={diem_de_xuat:'',nhan_xet_chung:'',dinh_huong_tiep_theo:'',loi:[]};
    sub2.result.loi.push({id:uid(), trang:page+1, x,y,w:w2,h:h2, loai_loi:'Lỗi mới', mo_ta:'', cach_khac_phuc:''});
    state.ui.activeErrIdx = sub2.result.loi.length-1;
    renderReviewModal();
  });
  stage.addEventListener('pointercancel', ()=>{ cleanupTemp(); });
}
function armDrawMode(){
  state.ui.drawing = true;
  const stage=$('#pageStage'); if(stage) stage.style.touchAction='none'; // để kéo vẽ được trên điện thoại (không cuộn trang)
  const btn=$('#addErrBtn'); if(btn){ btn.classList.add('btn-green'); btn.textContent='✏️ Đang vẽ… kéo trên ảnh'; }
}

  epsilon:'ε', varepsilon:'ε', zeta:'ζ', eta:'η', theta:'θ', vartheta:'ϑ', Theta:'Θ',
  iota:'ι', kappa:'κ', lambda:'λ', Lambda:'Λ', mu:'μ', nu:'ν', xi:'ξ', Xi:'Ξ',
  pi:'π', varpi:'ϖ', Pi:'Π', rho:'ρ', varrho:'ϱ', sigma:'σ', Sigma:'Σ',
  tau:'τ', upsilon:'υ', phi:'φ', varphi:'φ', Phi:'Φ', chi:'χ', psi:'ψ', Psi:'Ψ',
  omega:'ω', Omega:'Ω'
};

/* Dải ký tự (Hy Lạp, mũi tên, toán tử, hình học) mà Be Vietnam Pro KHÔNG có glyph
   nhưng font phụ MathSym (DejaVu Sans rút gọn) CÓ. Ký tự thuộc dải này sẽ được vẽ
   bằng MathSym (xem _fontRuns / drawStr) nên hiện đúng √ ≤ ≥ π ∑ ∫ … thay vì ô trống.
   (Mỗi cặp là [mã đầu, mã cuối] – trùng khớp đúng phạm vi glyph có trong MathSym.)  */
const MATHFONT_RANGES = [[0x0370,0x0377],[0x037A,0x037F],[0x0384,0x038A],[0x038C,0x038C],[0x038E,0x03A1],[0x03A3,0x03FF],[0x2190,0x22FF],[0x25A0,0x25FF]];
function _isMathGlyph(cp){ for(const r of MATHFONT_RANGES){ if(cp>=r[0]&&cp<=r[1]) return true; } return false; }
/* Tách chuỗi thành các đoạn liền nhau cùng loại font: {s, math:true|false}.
   Nhờ đó phần chữ Việt vẽ bằng Be Vietnam Pro, ký hiệu toán vẽ bằng MathSym –
   không bao giờ trộn ký tự "lạ" vào một lần doc.text (tránh mất phần chữ phía sau). */
function _fontRuns(str){
  const out=[]; let cur=null;
  for(const ch of String(str)){
    const m=_isMathGlyph(ch.codePointAt(0));
    if(!cur||cur.math!==m){ cur={s:'',math:m}; out.push(cur); }
    cur.s+=ch;
  }
  return out;
}

// Bản đồ ký hiệu cho PDF: nay DÙNG CHÍNH các ký hiệu Unicode như bản HTML (√ ≤ ≥ π …);
// ký hiệu nào Be Vietnam Pro thiếu sẽ tự động được vẽ bằng font phụ MathSym.
// Chỉ 2 ký hiệu hiếm nằm ngoài dải font phụ được thay bằng phương án ASCII an toàn.
const MATH_SYM_PDF = Object.assign({}, MATH_SYM_HTML, {
  longrightarrow:'→',   // ⟶ (U+27F6) ngoài dải MathSym → dùng mũi tên thường
  prime:"'"             // ′ (U+2032) ngoài dải MathSym → dùng dấu nháy
});

function _matchBrace(s, i){ let d=0; for(let j=i;j<s.length;j++){ const c=s[j]; if(c==='{')d++; else if(c==='}'){d--; if(d===0)return j;} } return -1; }
function _applySymbols(s, map){
  const names=Object.keys(map).sort((a,b)=>b.length-a.length);
  const re=new RegExp('\\\\(' + names.join('|') + ')(?![a-zA-Z])','g');
  return s.replace(re,(m,n)=>map[n]);
}
function _escHTML(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function _restore(s){ return s.replace(/\u0002/g,'^').replace(/\u0003/g,'_').replace(/\u0004/g,'{').replace(/\u0005/g,'}'); }

// Dạng hàm KHÔNG có dấu \ :  sqrt(...) / sqrt{...} / sqrt3  ->  √ (giữ ngoặc khi biểu thức nhiều hạng tử)
function _bareSqrt(s){
  let out='', i=0; const low=s.toLowerCase();
  while(true){
    const idx=low.indexOf('sqrt', i);
    if(idx<0){ out+=s.slice(i); break; }
    const before=s[idx-1];
    if(before && /[A-Za-z]/.test(before)){ out+=s.slice(i, idx+4); i=idx+4; continue; } // là phần của từ khác (chữ cái); còn số đứng trước là hệ số
    out+=s.slice(i, before==='\\'?idx-1:idx);        // bỏ dấu \ đứng ngay trước nếu có
    let j=idx+4; while(j<s.length && /\s/.test(s[j])) j++;
    const open=s[j];
    if(open==='('||open==='{'){
      const close=open==='('?')':'}'; let d=0,k=j;
      for(;k<s.length;k++){ if(s[k]===open)d++; else if(s[k]===close){d--; if(d===0)break;} }
      if(k<s.length){ const inner=s.slice(j+1,k).trim();
        out += /^[0-9A-Za-z.,]+$/.test(inner) ? ('√'+inner) : ('√('+inner+')'); i=k+1;
      } else { out+='√'; i=j; }
    } else {
      const tok=/^(\d+(?:[.,]\d+)?|[A-Za-z])/.exec(s.slice(j));
      if(tok){ out+='√'+tok[0]; i=j+tok[0].length; } else { out+='√'; i=j; }
    }
  }
  return out;
}

// Shared pre-processing (everything except sup/sub serialisation)
function _mathPre(str, mode){
  let s = String(str==null?'':str);
  const map = mode==='html' ? MATH_SYM_HTML : MATH_SYM_PDF;
  // 1) strip math delimiters, keep inner
  s = s.replace(/\$\$([\s\S]*?)\$\$/g,'$1').replace(/\$([^$\n]*)\$/g,'$1');
  s = s.replace(/\\\[([\s\S]*?)\\\]/g,'$1').replace(/\\\(([\s\S]*?)\\\)/g,'$1');
  // 2) hard line break -> marker
  s = s.replace(/\\\\(\s*\[[^\]]*\])?/g,'\u0001');
  const wrapF = x => /[+\-*/=<>\s]/.test(x) ? ('('+x+')') : x;
  // 3) \frac{..}{..} innermost-first
  for(let k=0;k<40;k++){ const n=s.replace(/\\[dt]?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,(m,a,b)=>wrapF(a.trim())+'/'+wrapF(b.trim())); if(n===s)break; s=n; }
  // 4) \sqrt[n]{..}  ->  √  (cả HTML lẫn PDF; ở PDF, √ được vẽ bằng font phụ MathSym)
  for(let k=0;k<40;k++){
    const n=s.replace(/\\sqrt\s*(?:\[([^\]]*)\])?\s*\{([^{}]*)\}/g,(m,idx,x)=>{
      const t=x.trim();
      const inner=/[+\-*/=<>\s]/.test(t)?('('+t+')'):t;
      return (idx?idx.trim():'')+'√'+inner;
    });
    if(n===s)break; s=n;
  }
  // 4b) Dạng căn không có dấu \ (AI hay xuất kiểu này): sqrt(3) / sqrt{x+1} / sqrt3  ->  √
  s = s.replace(/\\sqrt(?![a-zA-Z])/g,'sqrt');
  s = _bareSqrt(s);
  // 4c) Vài toán tử ASCII thông dụng -> ký hiệu Unicode
  s = s.replace(/<=/g,'≤').replace(/>=/g,'≥').replace(/!=/g,'≠').replace(/~=/g,'≈')
       .replace(/\+\/\-/g,'±').replace(/\+\-/g,'±').replace(/\-\+/g,'∓')
       .replace(/([0-9A-Za-z\)\]])\s*\*\s*([0-9A-Za-z\(\[])/g,'$1·$2');
  // 5) text wrappers -> inner
  for(let k=0;k<15;k++){ const n=s.replace(/\\(?:text|textrm|textbf|textit|mathrm|mathbf|mathit|mathsf|mathcal|operatorname)\s*\{([^{}]*)\}/g,'$1'); if(n===s)break; s=n; }
  // 5b) degree written as ^\circ / ^{\circ} / ^{o} -> baseline ° (both modes have °)
  s = s.replace(/\^\s*\{\s*\\circ\s*\}/g,'°').replace(/\^\s*\\circ(?![a-zA-Z])/g,'°');
  s = s.replace(/\^\s*\{\s*[oO°]\s*\}/g,'°');
  // 6) named symbols
  s = _applySymbols(s, map);
  // 7) structural spacing commands -> space
  s = s.replace(/\\(?:left|right|bigl?|Bigl?|biggl?|Biggl?|displaystyle|textstyle|scriptstyle|limits|nolimits|,|;|:|!|>|quad|qquad)(?![a-zA-Z])/g,' ');
  s = s.replace(/\\ /g,' ');
  // 8) escaped specials -> sentinels (protect from sup/sub + brace cleanup)
  s = s.replace(/\\\^/g,'\u0002').replace(/\\_/g,'\u0003').replace(/\\\{/g,'\u0004').replace(/\\\}/g,'\u0005');
  s = s.replace(/\\([$%&#])/g,'$1');
  // 9) drop any other unknown \command, keep its letters
  s = s.replace(/\\([a-zA-Z]+)/g,'$1');
  return s;
}

function mathToHTML(str){
  let s = _mathPre(str, 'html');
  s = _escHTML(s);
  s = s.replace(/\^\{([^{}]*)\}/g,(m,g)=>'<sup>'+g+'</sup>').replace(/_\{([^{}]*)\}/g,(m,g)=>'<sub>'+g+'</sub>');
  s = s.replace(/\^([^\s^_{}])/g,'<sup>$1</sup>').replace(/_([^\s^_{}])/g,'<sub>$1</sub>');
  s = s.replace(/[{}]/g,'');
  s = _restore(s);
  s = s.replace(/\u0001/g,'<br>');
  s = s.replace(/[ \t]{2,}/g,' ');
  return s.trim();
}

function mathToRuns(str){
  const s = _mathPre(str, 'pdf');
  const runs=[]; let buf='';
  const clean = t => t.replace(/[{}]/g,'').replace(/[ \t]{2,}/g,' ');
  const flush = () => { if(buf){ runs.push({t:'txt', s:clean(buf)}); buf=''; } };
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(ch==='\u0001'){ flush(); runs.push({t:'br'}); continue; }
    if(ch==='^'||ch==='_'){
      const t = ch==='^'?'sup':'sub';
      let content=null;
      if(s[i+1]==='{'){ const e=_matchBrace(s,i+1); if(e>0){ content=s.slice(i+2,e); i=e; } }
      else { const nx=s[i+1]; if(nx!==undefined && !/\s/.test(nx) && nx!=='^' && nx!=='_'){ content=nx; i+=1; } }
      if(content===null){ buf+=ch; continue; }
      flush();
      runs.push({t, s:clean(content)});
      continue;
    }
    buf+=ch;
  }
  flush();
  for(const r of runs){ if(r.s!=null) r.s=_restore(r.s); }
  return runs.filter(r => r.t==='br' || (r.s && r.s.length));
}

/* ---------- PDF rich-text layout (pure: returns positioned lines) ---------- */
// runs -> word list; sup/sub attach to the preceding word (no inserted space).
function _layoutWords(runs, size, style){
  const words=[]; let cur=null, pendingSpace=false;
  const supDy=-size*0.085, subDy=size*0.055, ssSize=size*0.72;
  const newWord = sb => { cur={chunks:[], spaceBefore:sb}; words.push(cur); };
  for(const run of runs){
    if(run.t==='br'){ words.push({br:true}); cur=null; pendingSpace=false; continue; }
    if(run.t==='txt'){
      const parts=run.s.split(/(\s+)/);
      for(const p of parts){
        if(p==='') continue;
        if(/^\s+$/.test(p)){ cur=null; pendingSpace=true; continue; }
        newWord(pendingSpace); pendingSpace=false;
        cur.chunks.push({s:p, size, style, dy:0});
      }
    } else {
      const dy = run.t==='sup' ? supDy : subDy;
      if(!cur){ newWord(pendingSpace); pendingSpace=false; }
      cur.chunks.push({s:run.s, size:ssSize, style, dy});
    }
  }
  return words;
}

// Returns array of lines; each line = [{s,size,style,dx,dy}]. `measureW(s,size,style)` -> width (mm).
function richLines(runs, maxW, size, style, measureW){
  const words=_layoutWords(runs, size, style);
  const spaceW=measureW(' ', size, style);
  for(const wd of words){ if(wd.br){wd.w=0;continue;} let ww=0; for(const c of wd.chunks) ww+=measureW(c.s,c.size,c.style); wd.w=ww; }
  const lines=[]; let cur=[], curX=0, started=false;
  const push=()=>{ lines.push(cur); cur=[]; curX=0; started=false; };
  for(const wd of words){
    if(wd.br){ push(); continue; }
    let lead = (started && wd.spaceBefore)?spaceW:0;
    if(started && curX+lead+wd.w>maxW){ push(); lead=0; }
    curX += (started && wd.spaceBefore)?spaceW:0;
    for(const c of wd.chunks){ cur.push({s:c.s,size:c.size,style:c.style,dx:curX,dy:c.dy}); curX+=measureW(c.s,c.size,c.style); }
    started=true;
  }
  push();
  return lines;
}


/* ============================= PDF EXPORT ============================= */
/* Nhúng font Be Vietnam Pro (hỗ trợ đầy đủ dấu tiếng Việt) + font phụ MathSym
   (DejaVu Sans rút gọn, chứa ký hiệu toán) vào jsPDF.
   window.__VF được nạp từ các khối dữ liệu font (base64) ở đầu trang.       */
let __vfLoaded = false, __mfLoaded = false;
function registerVietFonts(doc){
  const V = window.__VF || {};
  if(V.regular){ doc.addFileToVFS('BVP-Regular.ttf', V.regular); doc.addFont('BVP-Regular.ttf','BeVietnam','normal'); }
  if(V.bold){    doc.addFileToVFS('BVP-Bold.ttf',    V.bold);    doc.addFont('BVP-Bold.ttf',   'BeVietnam','bold'); }
  if(V.italic){  doc.addFileToVFS('BVP-Italic.ttf',  V.italic);  doc.addFont('BVP-Italic.ttf', 'BeVietnam','italic'); }
  if(V.math){    doc.addFileToVFS('MathSym.ttf',     V.math);    doc.addFont('MathSym.ttf',    'MathSym','normal'); }
  __vfLoaded = !!V.regular;
  __mfLoaded = !!V.math;
}

async function buildStudentPDF(sub, asg, cls, stu){
  const jsPDF = await ensurePdfLib();
  const doc = new jsPDF({unit:'mm', format:'a4'});
  registerVietFonts(doc);
  const F  = __vfLoaded ? 'BeVietnam' : 'helvetica';  // font chữ chính (dự phòng nếu chưa nạp được)
  const MF = __mfLoaded ? 'MathSym'   : F;            // font phụ cho ký hiệu toán: √ ≤ ≥ π ∑ ∫ ∈ →  ...

  const pageW=210, pageH=297, margin=14;
  const contentW = pageW - 2*margin;
  const bottom = pageH - 15;                 // chừa chỗ cho chân trang
  const t   = state.meta.teacher || {};
  const res = sub.result || {loi:[]};
  const imgs = sub.images || [];
  const errs = res.loi || [];

  const setF = (style,size,color)=>{ doc.setFont(F,style); doc.setFontSize(size); doc.setTextColor(...(color||[0,0,0])); };
  let y = 0;

  /* Đo bề rộng 1 chuỗi: phần chữ đo bằng font chính, ký hiệu toán đo bằng font phụ
     (đúng như khi vẽ) để canh dòng/mũ/chỉ số không bị lệch. */
  const measureText = (s,size,style)=>{
    let w=0;
    for(const r of _fontRuns(s)){ doc.setFont(r.math?MF:F, r.math?'normal':style); doc.setFontSize(size); w+=doc.getTextWidth(r.s); }
    return w;
  };
  /* Vẽ 1 chuỗi tại (x,yy) theo đường chân chữ, tự chuyển sang font phụ MathSym cho từng
     ký hiệu toán rồi trở lại font chính. Trả về hoành độ cuối. Không bao giờ đưa ký tự mà
     font đang dùng không có vào một lần doc.text (nếu không jsPDF sẽ cắt mất phần còn lại). */
  const drawStr = (s,x,yy,size,style)=>{
    let cx=x;
    for(const r of _fontRuns(s)){ doc.setFont(r.math?MF:F, r.math?'normal':style); doc.setFontSize(size); doc.text(r.s,cx,yy); cx+=doc.getTextWidth(r.s); }
    return cx;
  };
  /* Đo chiều cao (mm) của một đoạn văn có công thức toán (không vẽ) */
  function measureRich(runs,w,size,style,lineH){ return richLines(runs,w,size,style,measureText).length*lineH; }
  /* Vẽ đoạn văn có công thức toán: tự xuống dòng, mũ/chỉ số nhỏ & nâng/hạ đúng chỗ,
     tự sang trang khi hết chỗ. yOffset chỉ dịch phần chữ, không ảnh hưởng bước nhảy dòng. */
  function drawRich(runs,x,w,size,style,color,lineH,yOffset){
    yOffset = yOffset||0;
    const lines = richLines(runs,w,size,style,measureText);
    for(const line of lines){
      ensure(lineH);
      for(const c of line){
        doc.setTextColor(color[0],color[1],color[2]);
        drawStr(c.s, x+c.dx, y+yOffset+(c.dy||0), c.size, c.style);
      }
      y += lineH;
    }
    doc.setTextColor(0,0,0);
  }
  /* Đoạn văn có nhãn + nội dung công thức toán (thay cho paras cũ) */
  function richParas(label, text){
    setF('bold',10.5); ensure(7); doc.text(label, margin, y); y+=5.6;
    const runs = mathToRuns((text&&text.trim())?text:'(không có)');
    drawRich(runs, margin, contentW, 10, 'normal', [0,0,0], 5);
  }
  /* Khối ký tên giáo viên (đặt ngay sau phần nhận xét & định hướng) */
  function signatureBlock(){
    ensure(40);
    const cx = pageW - margin - 34;            // tâm cột chữ ký (bên phải)
    y += 8;
    const d = new Date(sub.gradedAt||Date.now());
    setF('italic',9.5,[90,90,90]);
    doc.text(`Ngày ${d.getDate()} tháng ${d.getMonth()+1} năm ${d.getFullYear()}`, cx, y, {align:'center'}); y+=6;
    setF('bold',10.5,[20,20,20]);
    doc.text('Giáo viên chấm bài', cx, y, {align:'center'}); y+=5;
    setF('italic',8.7,[120,120,120]);
    doc.text('(Ký, ghi rõ họ tên)', cx, y, {align:'center'}); y+=15;
    setF('bold',11.5,[0,0,0]);
    doc.text(t.fullName || t.shortName || '', cx, y, {align:'center'});
    doc.setTextColor(0,0,0);
  }

  function footer(){
    const line = [t.fullName, t.school, t.phone].filter(Boolean).join('   ·   ');
    if(!line) return;
    setF('normal',8,[135,135,135]);
    doc.text(line, pageW/2, pageH-8, {align:'center'});
    doc.setTextColor(0,0,0);
  }
  function header(){
    setF('bold',15,[193,39,45]);
    doc.text('PHIẾU CHẤM BÀI', margin, 18);
    setF('normal',10.5);
    doc.text(`Học sinh: ${stu.name}      Lớp: ${cls.name}`, margin, 26);
    setF('bold',11.5);
    doc.text(doc.splitTextToSize(`Bài tập: ${asg.title}`, contentW), margin, 33);
    setF('normal',9.5,[110,110,110]);
    doc.text(`Ngày chấm: ${new Date(sub.gradedAt||Date.now()).toLocaleDateString('vi-VN')}`, margin, 39);
    doc.setTextColor(0,0,0);
    doc.setDrawColor(220,213,194); doc.setLineWidth(0.3); doc.line(margin,42,pageW-margin,42);
    y = 50;
  }
  function newPage(){ footer(); doc.addPage(); header(); }
  function ensure(h){ if(y+h>bottom) newPage(); }

  // Đoạn văn có nhãn, tự xuống dòng + tự sang trang
  function paras(label, text){
    setF('bold',10.5); ensure(7); doc.text(label, margin, y); y+=5.6;
    setF('normal',10);
    const lines = doc.splitTextToSize((text&&text.trim())?text:'(không có)', contentW);
    for(const ln of lines){ ensure(5); doc.text(ln, margin, y); y+=5; }
  }

  /* ---------- TRANG 1: ĐIỂM + NHẬN XÉT & ĐỊNH HƯỚNG + CHỮ KÝ ---------- */
  header();
  setF('bold',12,[193,39,45]);
  doc.text(`Điểm: ${res.diem_de_xuat ?? '—'}`, margin, y); y+=8.5;
  doc.setTextColor(0,0,0);
  richParas('Nhận xét của giáo viên:', res.nhan_xet_chung);
  y += 3;
  richParas('Định hướng học tập tiếp theo:', res.dinh_huong_tiep_theo);
  signatureBlock();   // chữ ký giáo viên ngay sau nhận xét & định hướng

  /* ---------- CÁC TRANG BÀI LÀM: ĐÃ KHOANH LỖI + HƯỚNG KHẮC PHỤC ---------- */
  for(let pi=0; pi<imgs.length; pi++){
    newPage();
    const pageNo = pi+1;
    setF('bold',10,[110,110,110]);
    doc.text(`Bài làm của học sinh — trang ${pageNo}/${imgs.length}`, margin, y); y+=5.5;
    doc.setTextColor(0,0,0);

    const eh = errs.map((e,i)=>({...e,_i:i})).filter(e=>(e.trang||1)===pageNo);

    // (1) Đo trước chiều cao của TOÀN BỘ danh sách lỗi của trang này, để ảnh + phần lỗi
    //     có thể cùng nằm trên MỘT trang PDF và để giữ nguyên khối lỗi (không cắt rời).
    const listW = contentW - 7;
    const errBlocks = [];
    let errListH = 0;
    for(const e of eh){
      const r1 = mathToRuns(e.loai_loi||'Lỗi');
      const hasDesc = !!(e.mo_ta && e.mo_ta.trim());
      const r2 = hasDesc ? mathToRuns(e.mo_ta) : [];
      const fix = (e.cach_khac_phuc && e.cach_khac_phuc.trim()) ? e.cach_khac_phuc : '(chưa có)';
      const r3 = [{t:'txt',s:'Khắc phục: '}].concat(mathToRuns(fix));
      const h1 = measureRich(r1, listW, 9.3, 'bold',   4.6);
      const h2 = hasDesc ? measureRich(r2, listW, 9,   'normal', 4.4) : 0;
      const h3 = measureRich(r3, listW, 8.8, 'italic', 4.4);
      const _bh = h1 + h2 + h3 + 4.5;
      errBlocks.push({e, r1, r2, r3, hasDesc, blockH:_bh});
      errListH += _bh;
    }
    const errAreaH = eh.length ? (6 + errListH) : 0;      // 6mm cho tiêu đề "Các lỗi..."
    const errFitsOnePage = errAreaH <= (bottom - 50);     // khối lỗi có vừa trọn 1 trang không

    // (2) Ảnh: dùng trọn chiều rộng, nhưng ưu tiên co lại vừa đủ để CẢ ảnh + TẤT CẢ lỗi
    //     của trang này cùng nằm trên một trang. Nếu không thể, dồn nguyên khối lỗi sang trang mới.
    const dims = await imgDims(imgs[pi]);
    let iw = contentW, ih = iw*dims.h/dims.w;
    const gap          = eh.length ? 7 : 4;               // khoảng cách ảnh -> danh sách lỗi
    const maxHAlone    = bottom - y - 4;                  // ảnh chiếm gần trọn trang
    const maxHTogether = bottom - y - gap - errAreaH - 2; // ảnh + toàn bộ lỗi chung 1 trang
    const minImgH      = Math.min(ih, 85);                // ngưỡng để ảnh vẫn đủ rõ
    let errOnNewPage = false;
    if(ih > maxHTogether){
      if(!eh.length){
        if(ih > maxHAlone){ ih = maxHAlone; iw = ih*dims.w/dims.h; }
      } else if(errFitsOnePage && maxHTogether >= minImgH){
        ih = maxHTogether; iw = ih*dims.w/dims.h;         // co ảnh cho vừa toàn bộ phần lỗi
      } else {
        if(ih > maxHAlone){ ih = maxHAlone; iw = ih*dims.w/dims.h; }
        errOnNewPage = errFitsOnePage;                    // dồn NGUYÊN khối lỗi sang trang mới
      }
    }
    const ix = margin + (contentW-iw)/2, iy = y;
    doc.addImage(imgs[pi], 'JPEG', ix, iy, iw, ih);
    doc.setDrawColor(220,213,194); doc.setLineWidth(0.3); doc.rect(ix, iy, iw, ih);

    // Khoanh lỗi + số thứ tự
    eh.forEach(e=>{
      const bx=ix+e.x*iw, by=iy+e.y*ih, bw=Math.max(e.w*iw,2), bh=Math.max(e.h*ih,2);
      doc.setDrawColor(193,39,45); doc.setLineWidth(0.7); doc.rect(bx,by,bw,bh);
      doc.setFillColor(193,39,45); doc.circle(bx+bw, by, 2.7, 'F');
      setF('bold',7.5,[255,255,255]); doc.text(String(e._i+1), bx+bw, by+0.9, {align:'center'});
      doc.setTextColor(0,0,0);
    });

    y = iy + ih + gap;

    // (3) Danh sách lỗi & hướng khắc phục — GIỮ NGUYÊN KHỐI cho từng trang bài làm:
    //     tất cả lỗi của một trang luôn nằm trên cùng một trang PDF, không bị ngắt.
    if(eh.length){
      if(errOnNewPage){
        newPage();                                   // dồn nguyên khối lỗi sang trang mới
      } else if(errFitsOnePage && (y + errAreaH > bottom)){
        newPage();                                   // phòng sai số làm tròn (thiếu vài mm)
      }
      setF('bold',10.5,[193,39,45]);
      if(!errFitsOnePage) ensure(7);                 // khối lỗi dài hơn 1 trang: đành cho tràn
      doc.text('Các lỗi & hướng khắc phục', margin, y); y+=6;
      doc.setTextColor(0,0,0);
      const indent = margin+7;
      for(const b of errBlocks){
        const e = b.e;
        if(!errFitsOnePage) ensure(b.blockH);        // chỉ cắt khi thật sự không tránh được
        // số thứ tự
        doc.setFillColor(193,39,45); doc.circle(margin+2.4, y+1.4, 2.3, 'F');
        setF('bold',7.3,[255,255,255]); doc.text(String(e._i+1), margin+2.4, y+2.0, {align:'center'});
        doc.setTextColor(0,0,0);
        // loại lỗi (đậm)
        drawRich(b.r1, indent, listW, 9.3, 'bold', [20,20,20], 4.6, 2.3);
        // mô tả
        if(b.hasDesc){ drawRich(b.r2, indent, listW, 9, 'normal', [45,45,45], 4.4, 1.4); }
        // khắc phục (nghiêng)
        drawRich(b.r3, indent, listW, 8.8, 'italic', [47,82,51], 4.4, 1.7);
        y += 4.5;
        doc.setTextColor(0,0,0);
      }
    }
  }

  footer();
  return doc;
}

document.addEventListener('click', onClick);

async function onClick(e){
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act;
  try{
    switch(act){
      case 'doLogin': await doLogin(); break;
      case 'doSetPass': await doSetPass(); break;
      case 'logout': state.authed=false; render(); break;
      case 'nav': state.cur.tab=t.dataset.tab; state.cur.classId=null; render(); break;

      case 'toggleKeyVis': { const i=$('#geminiKey'); i.type = i.type==='password'?'text':'password'; break; }
      case 'testKey': await handleTestKey(); break;
      case 'saveGemini': {
        state.meta.gemini.apiKey = $('#geminiKey').value.trim();
        const picked = document.querySelector('input[name=modelPick]:checked');
        if(picked) state.meta.gemini.model = picked.value;
        await saveMeta(); toast('Đã lưu cài đặt AI.','ok'); break;
      }
      case 'saveTeacher': {
        state.meta.teacher = {shortName:$('#tShort').value.trim()||'GV', fullName:$('#tFull').value.trim(), school:$('#tSchool').value.trim(), phone:$('#tPhone').value.trim()};
        await saveMeta(); toast('Đã lưu thông tin giáo viên.','ok'); render(); break;
      }
      case 'changePass': {
        const p1=$('#chPass1').value, p2=$('#chPass2').value;
        if(p1.length<4){toast('Mật khẩu quá ngắn.','err'); break;}
        if(p1!==p2){toast('Hai mật khẩu không khớp.','err'); break;}
        state.meta.passHash = await sha256(p1); await saveMeta(); toast('Đã đổi mật khẩu.','ok'); break;
      }
      case 'saveRetention': {
        let d = parseInt($('#retDays').value, 10);
        if(isNaN(d) || d<0) d=0;
        if(d>3650) d=3650;
        state.meta.retentionDays = d;
        await saveMeta();
        const removed = await autoCleanup();
        if(d===0) toast('Đã tắt tự động xoá. Bài đã chấm sẽ được giữ vô thời hạn.','ok');
        else toast(`Đã đặt tự xoá bài đã chấm sau ${d} ngày.`+(removed?` Đã dọn ${removed} bài quá hạn.`:''),'ok');
        render(); break;
      }
      case 'exportBackup': await handleExportBackup(); break;
      case 'triggerImport': { const i=$('#importBackupInput'); if(i) i.click(); break; }

      case 'addClass': await handleAddClass(); break;
      case 'openClass': state.cur.classId=t.dataset.id; render(); break;
      case 'backClasses': state.cur.classId=null; render(); break;
      case 'delClass': if(confirm('Xoá lớp này và toàn bộ dữ liệu liên quan?')) await handleDelClass(t.dataset.id); break;
      case 'bulkAddStudents': await handleBulkAddStudents(t.dataset.id); break;
      case 'delStudent': await handleDelStudent(t.dataset.cid, t.dataset.sid); break;

      case 'newAssignment': assignmentFormModal(t.dataset.cid, null); break;
      case 'editAssignment': { const a=state.assignments.find(x=>x.id===t.dataset.id); assignmentFormModal(a.classId, a.id); break; }
      case 'closeAsgModal': $('#asgModal').remove(); break;
      case 'delAssignment': if(confirm('Xoá bài tập này và toàn bộ bài chấm liên quan?')) await handleDelAssignment(t.dataset.id); break;
      case 'gotoGrading': state.cur.tab='grading'; state.cur.classId=t.dataset.cid; state.cur.assignmentId=t.dataset.aid; render(); break;
      case 'rmAsgImg': state.ui._draftAssignment.questionImages.splice(Number(t.dataset.i),1); renderAsgThumbs(); break;
      case 'rmAsgAnswerImg': state.ui._draftAssignment.answerImages.splice(Number(t.dataset.i),1); renderAsgAnswerThumbs(); break;
      case 'aiSolve': await handleAiSolve(); break;
      case 'saveAssignment': await handleSaveAssignment(t.dataset.cid); break;

      case 'pickClassForGrading': break; // handled in change
      case 'selectAll': handleSelectAll(); break;
      case 'toggleSelect': {
        if(state.ui.selectedStudents.has(t.dataset.sid)) state.ui.selectedStudents.delete(t.dataset.sid);
        else state.ui.selectedStudents.add(t.dataset.sid);
        break;
      }
      case 'gradeOne': await handleGradeOne(t.dataset.sid); break;
      case 'batchGrade': await handleBatchGrade(t.dataset.aid); break;
      case 'delSubmission': if(confirm('Xoá bài nộp và kết quả chấm của học sinh này?')) await handleDelSubmission(t.dataset.sid); break;
      case 'openReview': openReviewModal(t.dataset.sid); break;
      case 'closeReview': $('#reviewModal').remove(); break;
      case 'gotoPage': state.ui.reviewPage=Number(t.dataset.i); state.ui.activeErrIdx=null; await renderReviewModal(); break;
      case 'selectErr': state.ui.activeErrIdx=Number(t.dataset.i); await renderReviewModal(); setTimeout(()=>{const c=document.querySelector(`.err-card[data-erridx="${t.dataset.i}"]`); if(c) c.scrollIntoView({block:'nearest'});},30); break;
      case 'delErr': {
        const sub=state.submissions.find(s=>s.id===state.cur.submissionId);
        sub.result.loi.splice(Number(t.dataset.i),1);
        await renderReviewModal(); break;
      }
      case 'moveErrUp': await handleMoveErr(Number(t.dataset.i), -1); break;
      case 'moveErrDown': await handleMoveErr(Number(t.dataset.i), +1); break;
      case 'rotatePage': await handleRotatePage(); break;
      case 'regradeAI': await handleGradeOne(t.dataset.sid, true); break;
      case 'saveReview': await handleSaveReview(t.dataset.sid); break;
      case 'exportOnePdf': await handleExportOne(t.dataset.sid); break;
    }
  }catch(err){
    console.error(err);
    const f = friendlyApiError(err.message);
    toast(f.msg, 'err', {title:f.title, ...(/quota/i.test(f.title)?{actionLabel:'Mở Cài đặt', onAction:()=>{state.cur.tab='settings'; render();}}:{})});
  }
}
async function onChange(e){
  const t = e.target;
  if(t.id==='pickClass' && t.dataset.act==='pickClassForGrading'){ state.cur.classId=t.value||null; state.cur.assignmentId=null; render(); return; }
  if(t.id==='pickAsg' && t.dataset.act==='pickAsgForGrading'){ state.cur.assignmentId=t.value||null; render(); return; }
  if(t.dataset.act==='uploadSubmission'){ await handleUploadSubmission(t); return; }
  if(t.dataset.act==='importBackup'){ await handleImportBackup(t); return; }
  if(t.dataset.act==='asgImgs' || t.id==='asgQImgs'){ await handleAsgQImgUpload(t); return; }
  if(t.id==='asgAnswerFiles'){ await handleAsgAnswerFileUpload(t); return; }
  if(t.name==='modelPick'){
    state.meta.gemini.model = t.value; await saveMeta();
    toast('Đã chuyển sang dùng model: '+t.value,'ok'); return;
  }
  if(t.dataset.act==='editErrField'){
    const sub=state.submissions.find(s=>s.id===state.cur.submissionId);
    sub.result.loi[Number(t.dataset.i)][t.dataset.f]=t.value;
    return;
  }
}
function onInput(e){
  const t=e.target;
  if(t.id==='asgQImgs') return;
  if(t.id==='asgAiAnswer') renderAsgAiAnswerPreview();
}
document.addEventListener('click', e=>{
  if(e.target.closest('#answerModeToggle button')){
    const btn=e.target.closest('button'); const mode=btn.dataset.mode;
    document.querySelectorAll('#answerModeToggle button').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    state.ui._draftAssignment.answerMode = mode;
    $('#answerTeacherWrap').classList.toggle('hidden', mode!=='teacher');
    $('#answerAiWrap').classList.toggle('hidden', mode!=='ai');
    if(mode==='ai') renderAsgAiAnswerPreview();
  }
});

/* ---- handlers ---- */
async function handleTestKey(){
  const key = $('#geminiKey').value.trim();
  if(!key){ toast('Vui lòng nhập API key trước.','err'); return; }
  state.meta.gemini.apiKey = key; // lưu tạm để dùng ngay
  const btn = event?.target; const originalLabel = btn ? btn.innerHTML : '';
  if(btn){ btn.innerHTML='<span class="spinner"></span> Đang tìm model...'; btn.disabled=true; }
  try{
    const models = await geminiListModels(key);
    if(!models.length){ toast('Không tìm thấy model nào khả dụng với API key này.','err'); return; }
    state.ui.modelList = models;
    renderModelList();
    let chosen=null;
    for(const m of models){
      m.testStatus='testing'; renderModelList();
      const r = await probeModel(key, m.id);
      if(r.ok){ m.testStatus='ok'; chosen=m; renderModelList(); break; }
      m.testStatus='fail'; m.failReason=r.reasonShort; renderModelList();
    }
    if(chosen){
      state.meta.gemini.model = chosen.id;
      await saveMeta();
      toast(`Đã tự động chọn và áp dụng model "${chosen.display||chosen.id}" — model này đang chấm bài được với tài khoản của bạn. Bạn không cần tự tìm model nữa.`, 'ok', {title:'Đã chọn model tự động', duration:8000});
    } else {
      toast('Không model nào chấm bài được lúc này (có thể tất cả đều hết hạn mức). Vui lòng thử lại sau vài phút, hoặc kiểm tra gói cước tại Google AI Studio.','err',{title:'Chưa tìm được model khả dụng', duration:9000});
    }
  } finally { if(btn){ btn.innerHTML=originalLabel; btn.disabled=false; } }
}
async function handleAddClass(){
  const el = $('#newClassName');
  const name = (el ? el.value : '').trim();
  if(!name){ toast('Nhập tên lớp.','err'); if(el) el.focus(); return; }
  const c = {id:uid(), name, students:[], createdAt:Date.now()};
  state.classes.push(c); await idbPut('classes', c);
  toast(`Đã thêm lớp \u201C${name}\u201D.`,'ok');
  render();
  const again = $('#newClassName'); if(again){ again.value=''; again.focus(); }
}
async function handleDelClass(id){
  state.assignments.filter(a=>a.classId===id).forEach(a=>{
    state.submissions.filter(s=>s.assignmentId===a.id).forEach(s=>idbDelete('submissions', s.id));
  });
  const asgIds = state.assignments.filter(a=>a.classId===id).map(a=>a.id);
  state.submissions = state.submissions.filter(s=>!asgIds.includes(s.assignmentId));
  for(const aid of asgIds) await idbDelete('assignments', aid);
  state.assignments = state.assignments.filter(a=>a.classId!==id);
  await idbDelete('classes', id);
  state.classes = state.classes.filter(c=>c.id!==id);
  state.cur.classId=null; render();
}
async function handleBulkAddStudents(classId){
  const raw = $('#bulkStudents').value;
  const names = raw.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!names.length){ toast('Chưa nhập tên học sinh.','err'); return; }
  const c = state.classes.find(x=>x.id===classId);
  c.students = c.students||[];
  names.forEach(n=>c.students.push({id:uid(), name:n}));
  await idbPut('classes', c);
  toast(`Đã thêm ${names.length} học sinh.`,'ok');
  render();
}
async function handleDelStudent(cid,sid){
  const c = state.classes.find(x=>x.id===cid);
  c.students = c.students.filter(s=>s.id!==sid);
  await idbPut('classes', c); render();
}
async function handleDelAssignment(id){
  const subs = state.submissions.filter(s=>s.assignmentId===id);
  for(const s of subs) await idbDelete('submissions', s.id);
  state.submissions = state.submissions.filter(s=>s.assignmentId!==id);
  await idbDelete('assignments', id);
  state.assignments = state.assignments.filter(a=>a.id!==id);
  render();
}
async function handleAsgQImgUpload(input){
  const files = Array.from(input.files||[]);
  for(const f of files){
    if(f.type==='application/pdf'){
      const imgs = await pdfFileToImages(f);
      state.ui._draftAssignment.questionImages.push(...imgs);
    } else {
      const u = await normalizeImageFile(f);
      state.ui._draftAssignment.questionImages.push(u);
    }
  }
  renderAsgThumbs();
}
async function handleAsgAnswerFileUpload(input){
  const files = Array.from(input.files||[]);
  if(!files.length) return;
  input.value = ''; // cho phép chọn lại cùng một tệp lần sau

  const busy=document.createElement('div');
  busy.className='toast';
  busy.innerHTML='<span class="toast-title">Đang xử lý</span>Đang đọc '+files.length+' tệp đáp án…';
  const wrap=$('#toastWrap'); if(wrap) wrap.appendChild(busy);

  const added=[]; const failed=[];
  for(const f of files){
    const name=(f.name||'').toLowerCase(); const type=(f.type||'');
    try{
      if(type==='application/pdf' || name.endsWith('.pdf')){
        added.push(...await pdfFileToImages(f));
      } else if(name.endsWith('.docx') || name.endsWith('.doc') || type.includes('officedocument.wordprocessing') || type==='application/msword'){
        added.push(...await docxFileToImages(f));
      } else if(type.startsWith('image/') || /\.(png|jpe?g|webp|gif|bmp|heic|heif)$/.test(name)){
        added.push(await normalizeImageFile(f));
      } else {
        failed.push(f.name||'tệp không rõ định dạng');
      }
    }catch(err){
      console.error('Lỗi đọc tệp đáp án', f.name, err);
      failed.push((f.name||'tệp') + (/(\.docx?|word)/i.test(name+type)?' (Word)':''));
    }
  }
  busy.remove();

  if(added.length){
    state.ui._draftAssignment.answerImages = (state.ui._draftAssignment.answerImages||[]).concat(added);
    renderAsgAnswerThumbs();
  }
  if(failed.length){
    const hasWord = failed.some(x=>/word|\.docx?/i.test(x));
    toast('Không đọc được: '+failed.join(', ')+'.'+(hasWord?' Với file Word, hãy lưu thành PDF rồi tải lên.':''),'err');
  } else if(added.length){
    toast(`Đã thêm ${added.length} trang đáp án.`,'ok');
  }
}
async function handleAiSolve(){
  const d = state.ui._draftAssignment;
  d.title = $('#asgTitle').value; d.question = $('#asgQuestion').value;
  if(!d.question && !d.questionImages.length){ toast('Cần nhập đề bài hoặc ảnh đề trước.','err'); return; }
  const btn = document.querySelector('[data-act=aiSolve]');
  btn.innerHTML='<span class="spinner"></span> AI đang giải đề...'; btn.disabled=true;
  try{
    const answer = await aiSolveAssignment(d);
    $('#asgAiAnswer').value = answer;
    renderAsgAiAnswerPreview();
    toast('AI đã soạn đáp án. Vui lòng kiểm tra lại.', 'ok');
  } finally { btn.innerHTML='✨ Tạo đáp án bằng AI (chính xác nhất)'; btn.disabled=false; }
}
async function handleSaveAssignment(classId){
  const d = state.ui._draftAssignment;
  d.title = $('#asgTitle').value.trim();
  d.question = $('#asgQuestion').value;
  if(!d.title){ toast('Nhập tên bài tập.','err'); return; }
  const mode = document.querySelector('#answerModeToggle button.on').dataset.mode;
  d.answerMode = mode;
  d.answerText = mode==='ai' ? $('#asgAiAnswer').value : $('#asgAnswerText').value;
  d.answerImages = mode==='teacher' ? (d.answerImages||[]) : [];
  d.classId = classId;
  await idbPut('assignments', d);
  const idx = state.assignments.findIndex(a=>a.id===d.id);
  if(idx>=0) state.assignments[idx]=d; else state.assignments.push(d);
  $('#asgModal').remove();
  toast('Đã lưu bài tập.','ok');
  render();
}
function handleSelectAll(){
  const cls = state.classes.find(c=>c.id===state.cur.classId);
  const asg = state.cur.assignmentId;
  (cls.students||[]).forEach(stu=>{
    const sub = state.submissions.find(s=>s.assignmentId===asg && s.studentId===stu.id);
    if(sub && (sub.images||[]).length) state.ui.selectedStudents.add(stu.id);
  });
  render();
}
async function handleUploadSubmission(input){
  const {cid,aid,sid} = input.dataset;
  const files = Array.from(input.files||[]);
  if(!files.length) return;
  input.value = ''; // cho phép chọn lại cùng một tệp lần sau

  // chỉ báo "đang xử lý" (PDF/Word cần chút thời gian để dựng ảnh)
  const busy=document.createElement('div');
  busy.className='toast';
  busy.innerHTML='<span class="toast-title">Đang xử lý</span>Đang đọc '+files.length+' tệp bài làm…';
  const wrap=$('#toastWrap'); if(wrap) wrap.appendChild(busy);

  const added=[]; const failed=[];
  for(const f of files){
    const name=(f.name||'').toLowerCase(); const type=(f.type||'');
    try{
      if(type==='application/pdf' || name.endsWith('.pdf')){
        added.push(...await pdfFileToImages(f));
      } else if(name.endsWith('.docx') || name.endsWith('.doc') || type.includes('officedocument.wordprocessing') || type==='application/msword'){
        added.push(...await docxFileToImages(f));
      } else if(type.startsWith('image/') || /\.(png|jpe?g|webp|gif|bmp|heic|heif)$/.test(name)){
        added.push(await normalizeImageFile(f));
      } else {
        failed.push(f.name||'tệp không rõ định dạng');
      }
    }catch(err){
      console.error('Lỗi đọc tệp', f.name, err);
      failed.push((f.name||'tệp') + (/(\.docx?|word)/i.test(name+type)?' (Word)':''));
    }
  }
  busy.remove();

  if(!added.length){
    const hasWord = failed.some(x=>/word|\.docx?/i.test(x));
    toast(failed.length ? ('Không đọc được: '+failed.join(', ')+'.'+(hasWord?' Với file Word, hãy lưu thành PDF rồi tải lên.':'')) : 'Không có tệp hợp lệ.','err');
    return;
  }

  let sub = state.submissions.find(s=>s.assignmentId===aid && s.studentId===sid);
  if(!sub){ sub={id:uid(), assignmentId:aid, studentId:sid, images:[], status:'pending', result:null, gradedAt:null}; state.submissions.push(sub); }
  sub.images = (sub.images||[]).concat(added); // GỘP THÊM, không ghi đè
  await idbPut('submissions', sub);

  let msg = `Đã thêm ${added.length} trang (tổng ${sub.images.length} trang).`;
  if(failed.length) msg += ` Bỏ qua: ${failed.join(', ')}.`;
  toast(msg, failed.length ? '' : 'ok');
  render();
}
async function handleGradeOne(subId, forceFromModal){
  const sub = state.submissions.find(s=>s.id===subId);
  const asg = state.assignments.find(a=>a.id===sub.assignmentId);
  sub.status='grading'; await idbPut('submissions', sub);
  if(!forceFromModal) render(); else toast('Đang chấm lại bằng AI...','');
  try{
    const result = await aiGradeSubmission(asg, sub);
    sub.result = result; sub.status='graded'; sub.gradedAt=Date.now();
    await idbPut('submissions', sub);
    toast('Đã chấm xong bằng AI.','ok');
  }catch(err){
    sub.status='error'; await idbPut('submissions', sub);
    const f = friendlyApiError(err.message);
    toast(f.msg, 'err', {title:'Chấm bài thất bại · '+f.title, ...(/quota/i.test(f.title)?{actionLabel:'Mở Cài đặt', onAction:()=>{state.cur.tab='settings'; render();}}:{})});
  }
  if(forceFromModal) await renderReviewModal(); else render();
}
async function handleBatchGrade(aid){
  const ids = [...state.ui.selectedStudents];
  if(!ids.length){ toast('Chưa chọn học sinh nào để chấm.','err'); return; }
  const subs = ids.map(sid=>state.submissions.find(s=>s.assignmentId===aid && s.studentId===sid)).filter(Boolean);
  for(const sub of subs){
    await handleGradeOne(sub.id);
  }
  state.ui.selectedStudents.clear();
}
async function handleDelSubmission(subId){
  await idbDelete('submissions', subId);
  state.submissions = state.submissions.filter(s=>s.id!==subId);
  render();
}
async function handleSaveReview(subId){
  const sub = state.submissions.find(s=>s.id===subId);
  if(!sub.result) sub.result={loi:[]};
  sub.result.diem_de_xuat = $('#revScore').value ? Number($('#revScore').value) : null;
  sub.result.nhan_xet_chung = $('#revComment').value;
  sub.result.dinh_huong_tiep_theo = $('#revNext').value;
  if(!sub.gradedAt) sub.gradedAt = Date.now();
  await idbPut('submissions', sub);
  toast('Đã lưu kết quả chấm.','ok');
  render();
}
async function handleExportOne(subId){
  const sub = state.submissions.find(s=>s.id===subId);
  const asg = state.assignments.find(a=>a.id===sub.assignmentId);
  const cls = state.classes.find(c=>c.id===asg.classId);
  const stu = cls.students.find(s=>s.id===sub.studentId);
  const doc = await buildStudentPDF(sub, asg, cls, stu);
  const fname = `${state.meta.teacher.shortName}_Chấm bài_${stu.name}.pdf`;
  doc.save(fname);
  toast('Đã xuất file PDF.','ok');
}
// Đổi thứ tự lỗi (đánh số lại theo vị trí trong danh sách). Số thứ tự chính là chỉ số + 1,
// nên hoán đổi vị trí trong mảng là tự động đổi số cả trong danh sách lẫn trên ảnh.
async function handleMoveErr(i, dir){
  const sub=state.submissions.find(s=>s.id===state.cur.submissionId);
  if(!sub||!sub.result||!Array.isArray(sub.result.loi)) return;
  const arr=sub.result.loi; const j=i+dir;
  if(j<0||j>=arr.length) return;
  const tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  if(state.ui.activeErrIdx===i) state.ui.activeErrIdx=j;
  else if(state.ui.activeErrIdx===j) state.ui.activeErrIdx=i;
  try{ await idbPut('submissions', sub); }catch(_){}
  await renderReviewModal();
}
// Xoay ảnh trang hiện tại 90° (kim đồng hồ) và xoay theo toạ độ các vùng lỗi để vẫn khớp.
async function handleRotatePage(){
  const sub=state.submissions.find(s=>s.id===state.cur.submissionId);
  if(!sub||!(sub.images||[]).length) return;
  const p=state.ui.reviewPage;
  const rotated=await rotate90(sub.images[p]);
  if(!rotated){ toast('Không xoay được ảnh trang này.','err'); return; }
  sub.images[p]=rotated;
  sub._orientFixed=true;
  (sub.result && sub.result.loi || []).forEach(e=>{
    if(((e.trang||1)-1)!==p) return;
    const x=e.x, y=e.y, w=e.w, h=e.h;
    if([x,y,w,h].every(v=>typeof v==='number')){ e.x=1-y-h; e.y=x; e.w=h; e.h=w; }
  });
  try{ await idbPut('submissions', sub); }catch(_){}
  await renderReviewModal();
}

/* ============================= ROUTER ============================= */
function render(){
  if(!state.authed){ renderLogin(); return; }
  if(state.cur.tab==='settings'){ renderSettings(); return; }
  if(state.cur.tab==='grading'){ renderGrading(); return; }
  renderClasses();
}

(async function init(){
  app.innerHTML = `<div class="login-wrap"><span class="spinner" style="width:22px;height:22px;border-color:rgba(43,43,46,.2);border-top-color:var(--ink);"></span></div>`;
  await loadAll();
  state.authed=false;
  render();
})();
</script>
